{% extends 'base.html' %}
{% load static %}
{% block content %}



  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1>Equipment Details</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="{% url 'equipmenttable' %}">View</a></li>
              <li class="breadcrumb-item active">Equipment</li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">

      <div class="row">
        <div class="col-md-8">
          <div class="card card-primary">
            <div class="card-header">
              <h3 class="card-title">Equipment Details</h3>

              <div class="card-tools">
                <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                  <!-- <i class="fas fa-minus"></i> -->
                </button>
              </div>
            </div>
                 <form method="POST", action="{% url 'equipment' %}">
             
                {% csrf_token %}
     
                <div class="card-body" >
              
                  <div class="form-group">
                   <label for="exampleInputBranchName">Equipment Name</label>
                    <input type="text" class="form-control" id="exampleInputeqpname" name="eqname" placeholder="Enter Equipment Name" required> 
                    
                  </div>
                   <div class="form-group">
                   <label for="exampleInputBranchName">Branch Name</label>
                    <select class="form-control" name="brname" required>
                        <option selected disabled value="">Select</option>
                                        {% for i in branchobj %}

                      <option value="{{i.id}}">{{i.Branch_Name}}</option>
                                        {% endfor %}
                      </select>
                    
                  </div>
                </div>
              
              <div class="card-footer">
                 {% if messages %}
        {% for message in messages %}
        <p style="color:green;">{{message}}</p> 
        {% endfor %}
        {% endif %}
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>
              </form>
            <!-- /.card-body -->
          </div>
          <!-- /.card -->
        </div>
     
      </div>

      
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->

  {% endblock %}
