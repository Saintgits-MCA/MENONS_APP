{% extends 'base.html' %}
{% load static %}
{% block content %}

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1>Therapist Appointment Details</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="appointmentdetailstable.html">View</a></li>
              <li class="breadcrumb-item active">Appointment</li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">

      <div class="row">
        <div class="col-md-12">
          <div class="card card-primary">
            <div class="card-header">
              <h3 class="card-title">Appointments</h3>

              <div class="card-tools">
                <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                  <!-- <i class="fas fa-minus"></i> -->
                </button>
              </div>
            </div>
             <form role="form">
      <div class="row">
          <div class="col-md-6">
              <div class="card">
             
             
                <div class="card-body">
                   <div class="form-group">
                    <label for="exampleInputRegisterNo">Department Name</label>
                     <select class="form-control">
                          <option>--select--</option>
                          <option>Dept1</option>
                          <option>Dept2</option>
                          <option>Dept3</option>
                      </select>
                    </div>
                  
                  <div class="form-group">
                    <label for="exampleInputPincode">Therapist Name</label>
                    <select class="form-control">
                          <option>--select--</option>
                          <option>Meera</option>
                          <option>Anu</option>
                          
                      </select>
                  </div>
                  <div class="form-group">
                    <label for="exampleInputRegisterNo">Patient Name</label>
                    <input type="text" class="form-control" id="exampleInputslottime" placeholder="Enter Patient Name">
                  </div>
                   <div class="form-group">
                    <label for="exampleInputRegisterNo">Appointment Date</label>
                    <input type="date" class="form-control" id="exampleInputdate">
                  </div>
                    <div class="form-group">
                    <label for="exampleInputContactNo">Contact No</label>
                    <input type="text" class="form-control" id="exampleInputContactNo" placeholder="Enter Contact No">
                  </div>
                  <div class="form-group">
                    <label for="exampleInputContactNo">Address</label>
                    <textarea class="form-control">
                      
                    </textarea>
                    
                  </div>
                   
               
                  
                  
                </div>
              </div>
            </div>

                <!-- /.card-body -->
             
              <div class="col-md-6">
              <div class="card">
             
             
                <div class="card-body">
                   <div class="form-group">
                    <label for="exampleInputRegisterNo">Token Number</label>
                    <input type="text" class="form-control" id="exampleInputslottime" placeholder="Enter Token Number">
                  </div>
                    <div class="form-group">
                    <label for="exampleInputRegisterNo">Slot Time</label>
                    <input type="text" class="form-control" id="exampleInputslottime" placeholder="Enter time">
                  </div>
                  <div class="form-group">
                    <label for="exampleInputRegisterNo">Start Time</label>
                    <input type="text" class="form-control" id="exampleInputslottime" placeholder="Enter time">
                  </div>
                  <div class="form-group">
                    <label for="exampleInputRegisterNo">End Time</label>
                    <input type="text" class="form-control" id="exampleInputslottime" placeholder="Enter time">
                  </div>
                 <!--    <div class="form-group">
                    <label for="exampleInputManagerName">Email</label>
                    <input type="text" class="form-control" id="exampleInputEmail" placeholder="Enter Email">
                  </div> -->
                 
                
                  <div class="form-group">
                    <label for="exampleInputemail">Remarks</label>
                    <input type="text" class="form-control" id="exampleInputRemarks" placeholder="Enter Remarks">
                  </div>
                </div>
              </div>
            </div>
          </div>
          </div>
                <div class="card-footer">
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>
              </form>
          
            <!-- /.card-body -->
          </div>
          <!-- /.card -->
        </div>
     
      </div>

      
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->
{% endblock %}
