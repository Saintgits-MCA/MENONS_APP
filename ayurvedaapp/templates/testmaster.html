{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="content-wrapper">
  <!-- Content Header -->
  <section class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h1>Test Master</h1>
        </div>
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item">
              {% if testmstrview == '1' %}
                <a href="{% url 'testmastertable' %}?menumanagement_id={{ idmngmnt }}">View All</a>
              {% endif %}
            </li>
            <li class="breadcrumb-item active">Create Test Master</li>
          </ol>
        </div>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <section class="content">
    <div class="row">
      <div class="col-md-12">
        <div class="card card-primary">
          <div class="card-header">
            <h3 class="card-title">Test Master</h3>
          </div>

          <form method="POST" action="{% url 'testmaster' %}?menumanagement_id={{ idmngmnt }}" onsubmit="return validateForm()">
            {% csrf_token %}
            <div class="card-body">
              
              <!-- Group Name -->
              <div class="form-group">
                <label for="groupName">Group Name</label>
                <input type="text" class="form-control" id="groupName" name="groupname" placeholder="Enter Group Name" required>
              </div>
                <div class="form-group">
                <label for="testname">rate</label>
                <input type="text" class="form-control" id="rate" name="rate"  required>
              </div>

              <!-- Status -->
              <div class="form-group">
                <label>Status</label><br>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="status" id="statusActive" value="Active" required>
                  <label class="form-check-label" for="statusActive">Active</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="status" id="statusInactive" value="Inactive">
                  <label class="form-check-label" for="statusInactive">Inactive</label>
                </div>
              </div>

            </div>

            <!-- Messages & Submit -->
            <div class="card-footer">
              {% if messages %}
                {% for message in messages %}
                  <p style="color:green;">{{ message }}</p>
                {% endfor %}
              {% endif %}
              <button type="submit" class="btn btn-primary">Submit</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
  function validateForm() {
      var groupName = document.getElementById('groupName').value.trim();
      var statusChecked = document.querySelector('input[name="status"]:checked');

      if (groupName === "") {
          alert("Group Name is required.");
          return false;
      }

      if (!statusChecked) {
          alert("Please select a status.");
          return false;
      }

      return true;
  }
</script>

{% endblock %}
