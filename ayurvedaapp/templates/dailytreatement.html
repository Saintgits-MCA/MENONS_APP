{% extends 'base.html' %}
{% load static %}
{% block content %}

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1>Daily Treatment Details</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item">
                <a href="{% url 'dailytreatmenttable' %}">View</a></li>
              <li class="breadcrumb-item active">Daily Treatment</li>
            </ol>
          </div>
        </div>
      </div>
    </section>
    <section class="content">
      <div class="row">
        <div class="col-md-12">
          <div class="card card-primary">
            <div class="card-header">
              <h3 class="card-title">Daily Treatment</h3>

              <div class="card-tools">
                <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                  <!-- <i class="fas fa-minus"></i> -->
                </button>
              </div>
            </div>
             <form method="POST", action="{% url 'dailytreatment' %}">
             
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6">
                        <div class="card">
                       
                       
                          <div class="card-body">
                              <div class="form-group">
                              <label for="exampleInputFirstName">Staff  </label>
                              <select class="form-control" name="staffname" required>
                      <option  selected disabled value="">Select</option>
                                {% for i in staffobj %}

                      <option value="{{i.id}}">{{i.Staff_firstname}}</option>
                              {% endfor %}
                      </select>
                            </div>
                            <div class="form-group">
                              <label for="exampleInputRegisterNo">MR Number</label>
                              <select class="form-control" name="mrno" required>
                        <option  selected disabled value="">Select</option>
                                        {% for i in mrnumobj %}

                      <option value="{{i.id}}" >{{i.Medical_Record_Number}}</option>
                                        {% endfor %}
                      </select>
                            </div>
                           
                            

                          </div>
                        </div>
                      </div>
                          <!-- /.card-body -->
                       
                        <div class="col-md-6">
                        <div class="card">
                       
                       
                          <div class="card-body">
                      
                              <div class="form-group">
                              <label for="exampleInputEmail1">Patient Name</label>
                              <select class="form-control" name="patientname" required>
                        <option  selected disabled value="">Select</option>
                                        {% for i in patientobj %}

                      <option value="{{i.id}}">{{i.Patient_Name}}</option>
                                        {% endfor %}
                      </select>
                            </div>
                        
                            <div class="form-group ">
                              <label for="exampleInputRegisterNo">Current Date</label>
                             <input type="date" class="form-control" name="currentdate" id="exampleInputdate" value="{{ currentdate|date:'Y-m-d' }}" readonly >

                            </div>
                             
                          </div>
                        </div>
                      </div>
                    </div>
          <div class="row">
              <div class="col-md-12">
              <div class="card">
                <div class="card-body">
                  <div class="row">
                    <div class="col-md-6">
                  <div class="form-group ">
                    <label for="exampleInputHouse">Treatment Name</label>
                      <button type="button" class="btn btn-primary" id="addTreatmentButton">Add Treatment</button>
                      
                      <select class="form-control" id="treatmentname" name="treatmentnames" required>
                        <option  selected disabled value="">Select</option>
                                        {% for i in treatments %}

                      <option value="{{i.id}}" data-hidden-value="{{i.Treatment_name}}">{{i.Treatment_name}}</option>
                                        {% endfor %}
                      </select>
                  </div>
                   </div>
                    <div class="col-md-6">
                  <div class="form-group ">
                    <label for="exampleInputHouse">Medicine Name</label>
                     
                      <select class="form-control" id="medicinename" name="medicinename" required>
                        <option  selected disabled value="">Select</option>
                                        {% for i in medicines %}

                      <option value="{{i.id}}">{{i.Medicinename}}</option>
                                        {% endfor %}
                      </select>
                  </div>
                   </div>
                 </div>
                  <div class="row">
                    <div class="col-md-6"><div class="treatment-container"  ></div></div>
                  <div class="col-md-6">
                   <div class="treatment-medicine"></div>
                 </div>
                </div>
              <!-- </div> -->
            </div>
          </div>

                <div class="card-footer">
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>
              </form>
          
            <!-- /.card-body -->
          </div>
          <!-- /.card -->
        </div>
     
      </div>

      
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->
<!-- Add this script to your template -->
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

<!-- ./wrapper -->
<script>
document.addEventListener("DOMContentLoaded", function() {
  const addTreatmentButton = document.getElementById("addTreatmentButton");
  const treatmentContainer = document.querySelector(".treatment-container");
  const treatmentmedicine = document.querySelector(".treatment-medicine");
  let treatmentCounter = 0;
 
  addTreatmentButton.addEventListener("click", function() {
    treatmentCounter++;

    const treatmentNameInput = document.createElement("input");
    const selectedTreatmentValue = document.getElementById("treatmentname").value;
    // Get the select element
    var selectElement = document.getElementById("treatmentname");
    // Get the selected index
    var selectedIndex = selectElement.selectedIndex;

    var selectedOption = selectElement.options[selectedIndex];

    var hiddenValue = selectedOption.getAttribute("data-hidden-value");
    treatmentNameInput.type = "text";
    treatmentNameInput.className = "form-control";
    treatmentNameInput.name = "treatment" + treatmentCounter;
    treatmentNameInput.placeholder = "Treatment Name" + treatmentCounter;
    treatmentNameInput.value = hiddenValue;
    treatmentContainer.appendChild(treatmentNameInput);

    const medicineNameInput = document.createElement("input");
    medicineNameInput.type = "text";
    medicineNameInput.className = "form-control";
    medicineNameInput.name = "medicine" + treatmentCounter;
    medicineNameInput.id = "selectedMedicines"+ treatmentCounter;
    medicineNameInput.placeholder = "Medicine Name " + treatmentCounter;
    treatmentmedicine.appendChild(medicineNameInput);
     // Reset the medicinename select element to its original state
    document.getElementById("medicinename").selectedIndex = 0;
   
});
function updateSelectedMedicines() {
        var selectedMedicines = [];
        var existingValue = document.getElementById('selectedMedicines'+ treatmentCounter).value;
        if (existingValue) {
            selectedMedicines.push(existingValue);
        }
        var selectedOptions = document.querySelectorAll('[name="medicinename"] option:checked');

        selectedOptions.forEach(function (option) {
            selectedMedicines.push(option.textContent);
        });
        document.getElementById('selectedMedicines'+ treatmentCounter).value = selectedMedicines.join(', ');
    }
    document.querySelector('[name="medicinename"]').addEventListener('change', updateSelectedMedicines);


});

</script>
{% endblock %}
