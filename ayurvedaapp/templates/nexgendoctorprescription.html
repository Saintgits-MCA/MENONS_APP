{% extends 'base.html' %}
{% load static %}
{% block content %}
<body>
    <div class="content-wrapper">
        <!-- Content Header (Page header) -->
        <section class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1>Prescription</h1>
                    </div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-right">
                            <li class="breadcrumb-item"><a href="#">Home</a></li>
                            <li class="breadcrumb-item active">Prescription</li>
                        </ol>
                    </div>
                </div>
            </div>
        </section>

        <section class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-12 displaydate" style="overflow-y: auto; max-height: 300px;">
                        <div id="popup" style="display: none;">
                            <div id="popupContent"></div>
                        </div>
                    </div>
                </div>
                <form method="POST" action="{% url 'savedoctorprescription' %}">
                    {% csrf_token %}
                    <div class="row p-3">
                        <div class="col-md-12">
                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-4">
                                            <div class="form-group">
                                              <label for="mrSearch">MR Number/PhoneNo/Name</label>
                                              <input type="text" id="mrSearch" class="form-control" placeholder="Type MR Number">
                                            </div>
                                        </div>
                                        <div class="col-md-4 mt-4"> 
                                           <button type="button" id="searchBtn" class="btn btn-primary">Search</button>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6"> 
                                            <div class="form-group">
                                                <label for="mrDropdown">Selected MR Number/Patient</label>
                                                <select class="form-control" name="mrnum" id="mrDropdown" required>
                                                  <option selected disabled value="">Select</option>
                                                </select>
                                              </div>
                                              <div class="form-group">
                                                <label for="ptdt">Patient Name</label>
                                                <input type="text" id="ptname" name="ptname" class="form-control" readonly>
                                              </div>
                                              <div class="form-group">
                                                <label for="ptdt">Patient Details</label>
                                                <input type="text" id="exampleInputAddress" class="form-control" readonly>
                                              </div>
                                              <div class="form-group">
                                                <label for="currentDate">Current Date</label>
                                                <input type="date" class="form-control" name="current_date" id="currentDate" required>
                                              </div>
                                        </div>
                
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label for="chiefComplaint">Chief Complaint</label>
                                                <textarea class="form-control" name="chief_complaint" id="chiefComplaint" rows="3" placeholder="Describe chief complaint" required></textarea>
                                            </div>
                                            <div class="form-group">
                                                <label for="note">Note</label>
                                                <textarea class="form-control" name="note" id="note" rows="3" placeholder="Enter any notes"></textarea>
                                            </div>
                                            <div class="form-group">
                                                <label for="diet">Diet</label>
                                                <textarea class="form-control" name="diet" id="diet" rows="3" placeholder="Enter diet advice"></textarea>
                                            </div>
                                        </div>
                                    </div>
                
                                    <div class="row">
                                        <div class="col-sm-3">
                                            <button type="button" class="btn btn-info" onclick="viewPreviousPrescriptions($('#mrDropdown').val())">View Previous Prescriptions</button>
                                        </div>
                                        <!-- <div class="col-sm-3">
                                            <button type="button" class="btn btn-info" data-toggle="modal" data-target="#caseHistoryModal" onclick="viewcasehistory($('#mrDropdown').val())">View Case History</button>
                                        </div>
                                        <div class="col-sm-3">
                                            <button type="button" class="btn btn-info" data-toggle="modal" data-target="#dailyreportModal" onclick="viewdailyreport($('#mrDropdown').val())">View Reports</button>
                                        </div> -->
                                    </div>
                
                                    <table class="table table-bordered mt-4">
                                        <thead>
                                            <tr>
                                                <th>Sl. No</th>
                                                <th>Medicine Name
                                                    <input type="text" class="form-control" id="searchInput" placeholder="Search for medicine...">
                                                    <select class="form-control" name="particulars" id="searchResults">
                                                        <option selected>Select</option>
                                                    </select>
                                                </th>
                                                <th>Count</th>
                                                <!-- <th>Dosage</th> -->
                                                <th>Directions</th>
                                                <input type="hidden" id="record_count" name="record_count" value="1">
                                                <th>
                                                    <button type="button" style="width:60px;height: 40px;" class="btn btn-primary" id="addBtn">Add</button>
                                                </th>
                                            </tr>
                                        </thead>
                                        <tbody id="tbody">
                                            <tr class="recordsheet"></tr>
                                        </tbody>
                                    </table>
                                </div>
                                <div class="card-footer">
                                    <button type="submit" class="btn btn-primary">Submit</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </div>

    <!-- Case History Modal -->
    <div class="modal fade" id="caseHistoryModal" tabindex="-1" aria-labelledby="caseHistoryModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="caseHistoryModalLabel">Case History</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="caseHistoryContent"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Daily Report Modal -->
    <div class="modal fade" id="dailyreportModal" tabindex="-1" aria-labelledby="dailyreportLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="dailyreportLabel">Daily Report</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="dailyreportContent"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Search Results Modal -->
    <div class="modal fade" id="searchModal" tabindex="-1" role="dialog" aria-labelledby="searchModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
          <div class="modal-content">
            <div class="modal-header bg-primary text-white">
              <h5 class="modal-title" id="searchModalLabel">Search Results</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <table id="searchResultsTable" class="display table table-bordered">
                <thead>
                  <tr>
                    <th>MR Number</th>
                    <th>Patient Name</th>
                    <th>Address</th>
                    <th>Contact No</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Results will be appended here -->
                </tbody>
              </table>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            </div>
          </div>
        </div>
    </div>

    <!-- Previous Prescriptions Modal -->
<div class="modal fade" id="previousPrescriptionsModal" tabindex="-1" aria-labelledby="previousPrescriptionsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="previousPrescriptionsModalLabel">Previous Prescriptions</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div id="previousPrescriptionsContent"></div> <!-- Content will be populated dynamically -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

      <script>$(document).ready(function() {
        // Initialize DataTable (without data initially)
        let table = $('#searchResultsTable').DataTable({
          paging: true,
          searching: true, // Enable internal search for filtering
          info: true,
          lengthChange: true, // Allow changing number of entries shown
          pageLength: 10,     // Limit results to 10 per page
        });
      
        // Event listener for the search button click
        $('#searchBtn').on('click', function() {
          let query = $('#mrSearch').val();
      
          // Ensure the search query is not empty
          if (query.trim() === '') {
            alert('Please enter a search term.');
            return;
          }
      
          // Clear previous table data
          table.clear().draw();
      
          // Send an AJAX request to search for the query
          fetch(`/search_mrno?query=${query}`)
            .then(response => response.json())
            .then(data => {
              // Check if data exists
              if (data.length > 0) {
                // Loop through the results and add to the table
                data.forEach(item => {
                  let actionBtn = `<button class="btn btn-primary select-btn" data-id="${item.id}" 
                                      data-name="${item.Patient_Name}" 
                                      data-mrno="${item.Medical_Record_Number}" 
                                      data-contact="${item.contactno}"
                                      data-address="${item.Housename}">
                                    Select
                                  </button>`;
      
                  // Make sure to add data in the correct order: MR Number -> Name -> Contact -> Address -> Action
                  table.row.add([
                    item.Medical_Record_Number,  // MR Number
                    item.Patient_Name,
                    item.Housename || 'N/A',            // Patient Name
                    item.contactno,              // Contact Number
                        // Address (if null, show 'N/A')
                    actionBtn,                   // Action Button
                  ]).draw(false); // Re-draw the table after adding the row
                });
      
                // Show the modal with the DataTable results
                $('#searchModal').modal('show');
              } else {
                alert('No matching records found.');
              }
            })
            .catch(error => {
              console.error('Error:', error);
              alert('There was an error retrieving the data. Please try again.');
            });
        });
        // Event delegation to handle clicks on dynamically generated "Select" buttons
        $('#searchResultsTable tbody').on('click', '.select-btn', function() {
          let id = $(this).data('id');
          let mrno = $(this).data('mrno');
          let name = $(this).data('name');
          let contact = $(this).data('contact');
          let address = $(this).data('address');
          // Populate the dropdown with the selected value
          $('#mrDropdown').html(`<option value="${id}" selected>${mrno} </option>`);
          // Populate the patient details input
          $('#exampleInputAddress').val(`${mrno} - ${name} (${contact})`);
          $('#ptname').val(`${name}`);
          
          // Close the modal
          $('#searchModal').modal('hide');
        });
      });
      </script>
    <script>
        $(document).ready(function () {
            function updatePatientDetails() {
                var selectedMrNumber = $("#mrDropdown").val();
                $.ajax({
                    type: "GET",
                    url: "{% url 'getmrdetails' %}",
                    data: { mrNumber: selectedMrNumber },
                    success: function (data) {
                        $("#exampleInputAddress").val(data.Housename);
                        $("#ptname").val(data.Patient_Name);
                        $("#ptphno").val(data.phno);
                        $("#ptemail").val(data.patient_email);
                    },
                    error: function (xhr, status, error) {
                        console.error("Error fetching patient details:", error);
                    },
                });
            }
            $("#mrDropdown").on("change", updatePatientDetails);
        });
    </script>

    <script>
        let treatmentCounter = 0;
        document.getElementById('addBtn').addEventListener('click', function () {
            addRecordSheetRow();
        });

        function addRecordSheetRow() {
            var inputField = document.getElementById('searchResults');
            var selectedValue = inputField.value;
            var medicineName = $("#searchResults option:selected").text();

            if (!medicineName || medicineName.trim() === '') {
                alert("Medicine name is required.");
                return;
            }

            var tbody = document.getElementById('tbody');
            treatmentCounter++;
            var newRow = document.createElement('tr');
            newRow.classList.add('recordsheet');

            $.ajax({
                type: 'GET',
                url: '/fetchmedicnedt/',
                data: { id: selectedValue },
                success: function (response) {
                    if (response.hasOwnProperty('error')) {
                        alert(response.error);
                        return;
                    }
                    newRow.innerHTML = `
                        <td><input type="text" class="form-control sl" name="sl${treatmentCounter}" value="${treatmentCounter}"></td>
                        <td>
                            <input type="text" class="form-control medicine" name="medicine${treatmentCounter}" value="${response.medicinename}" required>
                            <input type="hidden" class="form-control medicineid" name="medicineid${treatmentCounter}" value="${response.medid}">
                        </td>
                        <td><input type="text" class="form-control dosage" name="dosage${treatmentCounter}" required></td>
                        <td><textarea class="form-control direction" name="direction${treatmentCounter}" cols="25" rows="5" required></textarea></td>
                        <td><button type="button" class="btn btn-danger remove-item">Remove</button></td>
                    `;
                    tbody.appendChild(newRow);
                    document.getElementById('record_count').value = treatmentCounter;
                    $("table").on("click", ".remove-item", function () {
                        var row = $(this).closest("tr");
                        row.remove();
                    });
                },
                error: function (xhr, status, error) {
                    console.error("Error fetching name:", error);
                    alert("Medicine name is required.");
                }
            });
        }
    </script>

    <script>
        $(document).ready(function () {
            $('#searchInput').keyup(function () {
                var query = $(this).val();
                if (query.length >= 3) {
                    $.ajax({
                        url: "{% url 'prescriptionsearch_medicine' %}",
                        data: { 'term': query },
                        dataType: 'json',
                        success: function (data) {
                            $('#searchResults').empty();
                            $.each(data, function (index, item) {
                                $('#searchResults').append('<option value="' + item.item_id + '">' + item.item_name + ' - ' + item.unit + '</option>');
                                $('#searchResults option:last').data('med-id', item.item_id);
                                $('#searchResults option:last').data('sup-id', item.supplier_name);
                            });
                            $('#searchResults').trigger('change');
                        }
                    });
                } else {
                    $('#searchResults').empty();
                }
            });

            $('#searchResults').change(function () {
                var selectedOption = $(this).find(':selected');
                var selectedMedId = selectedOption.data('med-id');
                var selectedsupId = selectedOption.data('sup-id');
                $('#medid').val(selectedMedId);
                $('#supid').val(selectedsupId);
            });
        });
    </script>
<script>
   function viewPreviousPrescriptions(mrNumber) {
    $.ajax({
        type: "GET",
        url: "/newview_previous_prescriptions/", // Ensure this matches your URL
        data: { mrNumber: mrNumber },
        success: function (response) {
            // Check if there are previous prescriptions to display
            if (response.previous_prescriptions && response.previous_prescriptions.length > 0) {
                // Clear previous content
                $('#previousPrescriptionsContent').empty();
                
                // Create a table to display previous prescriptions
                let content = '<table class="table table-bordered"><thead><tr><th>Date</th><th>Medicine</th><th>Dosage</th><th>Direction</th><th>Notes</th></tr></thead><tbody>';
                
                // Loop through prescriptions and populate table rows
                response.previous_prescriptions.forEach(function(prescription) {
                    content += `<tr>
                        <td>${prescription.Current_Date}</td>
                        <td>${prescription.medicinename__itemnm}</td>
                        <td>${prescription.dosage}</td>
                        <td>${prescription.direction}</td>
                        
                        <td>${prescription.note}</td>
                    </tr>`;
                });
                
                content += '</tbody></table>';
                $('#previousPrescriptionsContent').html(content);
            } else if (response.error) {
                alert(response.error); // Handle any error messages returned
            } else {
                $('#previousPrescriptionsContent').html('<p>No previous prescriptions found.</p>');
            }

            // Show the modal with the previous prescriptions
            $('#previousPrescriptionsModal').modal('show');
        },
        error: function (xhr, status, error) {
            alert('An error occurred while fetching previous prescriptions: ' + xhr.responseText);
        }
    });
}

</script>


    
    <script>
        function viewcasehistory(mrNumber) {
            $.ajax({
                type: "GET",
                url: "/nexacasehistoryable/",
                data: { mrNumber: mrNumber },
                success: function (response) {
                    $('#caseHistoryContent').html(response);
                    $('#caseHistoryModal').show();
                },
                error: function (xhr, status, error) {
                    console.error("Error fetching previous prescriptions:", error);
                    alert("MR Number is required.");
                }
            });
        }
    </script>
<script>

    function viewdailyreport(mrNumber) {
        $.ajax({
            type: "GET",
            url: "/get_dailyreport_details/",
            data: { mrNumber: mrNumber },
            success: function (response) {
                $('#dailyreportContent').html(response);
                $('#dailyreportModal').show();
            },
            error: function (xhr, status, error) {
                console.error("Error fetching daily report details:", error);
                var errorMessage = xhr.responseJSON.error || "An error occurred while fetching daily report details.";
                alert(errorMessage);
            }
        });
    } 
</script>


{% endblock %}
