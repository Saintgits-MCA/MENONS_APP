{% extends 'base.html' %}
{% load static %}
{% block content %}

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1>Treatment  Details </h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item">
                {%if mntreatmntview == '1' %}
                <a href="{% url 'treatmenttable'%}?menumanagement_id={{ idmngmnt }}">View All</a></li>
                {%endif%}
              <li class="breadcrumb-item active">Treatment </li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">

      <div class="row">
        <div class="col-md-8">
          <div class="card card-primary">
            <div class="card-header">
              <h3 class="card-title">Treatment Master</h3>

              <div class="card-tools">
                <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                  <!-- <i class="fas fa-minus"></i> -->
                </button>
              </div>
            </div>
                 <form method="POST", action="{% url 'treatmentmaster' %}?menumanagement_id={{ idmngmnt }}">
                {% csrf_token %}
                <div class="card-body">
                    <div class="form-group">
                    <label for="exampleInputtreatmentName">Treatment Name</label>
                  <input type="text" class="form-control" id="exampleInputtreatmentName" name="treatmentname" placeholder="Enter Treatment Name" required>
                  </div>
                  <!--                      
                  <div class="form-group">
                    <label for="exampleInputtreatmentrate">Duration</label>
                   <input type="text" class="form-control" id="exampleInputtreatmentrate" name="time" placeholder="Enter Treatment Duration" >
                  </div>
                        -->
                   <div class="form-group">
                    <label for="exampleInputtreatmentrate">Rate</label>
                   <input type="text" class="form-control" id="exampleInputtreatmentrate" name="rate" placeholder="Enter Rate" required>
                  </div>
                  <div class="form-group">
                    <label for="exampleInputdescripion">Description</label>
                   <textarea class="form-control" name="description"></textarea>
                  </div>
                  
                 <div class="form-group">
                    <label for="exampleInputstatus">Status</label>
                    <br>
                    <input type="radio"value="active" name="exampleInputStatus" id="exampleInputstatus"required >
                    <label for="exampleInputstatus">Active</label>
                    <input type="radio"value="inactive"id="exampleInputStatus" name="exampleInputStatus" required>
                    <label for="exampleInputManagerName">Inactive</label>
                  </div>
                  
                
                  
                  
                </div>
             
           
                <div class="card-footer">
                   {% if messages %}
        {% for message in messages %}
        <p style="color:green;">{{message}}</p> 
        {% endfor %}
        {% endif %}
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>
              </form>         <!-- /.card-body -->
          </div>
          <!-- /.card -->
        </div>
     
      </div>

      
    </section>
    <!-- /.content -->
  </div>
{% endblock %}
