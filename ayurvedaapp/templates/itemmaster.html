{% extends 'base.html' %}
{% load static %}
{% block content %}

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1>Medicine Details</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"> 
                {%if itmstrview == '1'%}
                <a href="{% url 'medicinemastertable'%}?menumanagement_id={{ idmngmnt }}">View All</a>
              {%endif%}
              <li class="breadcrumb-item active">Medicine</li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">

      <div class="row">
        <div class="col-md-12">
          <div class="card card-primary">
            <div class="card-header">
              <h3 class="card-title">Medicine</h3>

              <div class="card-tools">
                <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                  <!-- <i class="fas fa-minus"></i> -->
                </button>
              </div>
            </div>
              <form method="POST", action="{% url 'itemmaster' %}?menumanagement_id={{ idmngmnt }}">
             
                {% csrf_token %}
      <div class="row">
          <div class="col-md-6">
              <div class="card">
             
             
                <div class="card-body">
                    <div class="form-group">
                    <label for="exampleInputFirstName">Purchase Invoice No</label>
                    <input type="text" class="form-control" id="exampleInputInvoiceNo" name="purchaseinvoicenum" placeholder="Enter  Purchase Invoice No" required>
                  </div>
                   <div class="form-group">
                    <label for="exampleInputEmail1">Medicine Name</label>
                    <select class="form-control" name="medicinename" id="item" required>
                      <option  selected disabled value="">Select</option>
                                          {% for i in itmname %}
  
                        <option value="{{i.id}}">{{i.itemnm}}</option>
                                          {% endfor %}
                        </select>
                  </div>
                  <div class="form-group">
                    <label for="exampleInputHouse">Generic Name</label>
                    <input type="text" class="form-control" id="exampleInputgenericname" name="genericname" placeholder="Enter Generic Name">
                  
                  </div>
                  
                  <div class="form-group">
                    <label for="exampleInputPincode">Company</label>
                <!-- <select class="form-control" name="company" required>
                    <option  selected disabled value="">Select</option>
                                        {% for i in companyobj %}

                      <option value="{{i.id}}">{{i.Comapany_name}}</option>
                                        {% endfor %}
                      </select> -->
                  </div>
                  <div class="form-group">
                    <label for="exampleInputPincode">Batch No</label>
                    <input type="text" class="form-control" id="exampleInputgenericname" name="batchnumber" placeholder="Enter Batch No">
                  
               
                  </div>
                   <div class="form-group">
                    <label for="exampleInputRegisterNo">Sub Category</label>
                    <select class="form-control" name="subcategory" required>
                     <option  selected disabled value="">Select</option>
                                        {% for i in subcategoryobj %}

                      <option value="{{i.id}}">{{i.Subcategory_name}}</option>
                                        {% endfor %}
                      </select>
                  </div>
                  <div class="form-group">
                    <label for="exampleInputRegisterNo">Base Unit</label>
                    <select class="form-control" id="bsunty" name="bsunty" required>
                      <option selected disabled value="">--Select Base Unit--</option>
                  </select>
                  </div>
                   
                </div>
              </div>
            </div>
              <div class="col-md-6">
              <div class="card">
                <div class="card-body">
                  <div class="form-group">
                    <label for="exampleInputPincode">Rack No</label>
                    <input type="text" class="form-control" id="exampleInputgenericname" name="rackno" placeholder="Enter Rack No">
                  
               
                  </div>
                   <div class="form-group">
                    <label for="exampleInputRegisterNo">Manufacture Date</label>
                    <input type="date" class="form-control" id="exampleInputMfgDate" name="mfgdate" placeholder="Enter Generic Name" onchange="validateManufactureDate()" required>
                  
                  </div>
                      <div class="form-group">
                    <label for="exampleInputRegisterNo">Expiry Date</label>
                    <input type="date" class="form-control" id="exampleInputExpDate" name="expdate" placeholder="Enter Generic Name"  onchange="validateExpiryDate()" required>
                  
                  </div>
                  
                
                  <div class="form-group">
                    <label for="exampleInputRegisterNo">Side Effects</label>
                    <textarea  class="form-control" name="sideeffects"></textarea>
                  </div>
                  <div class="form-group">
                    <label for="exampleInputRegisterNo">Quantity</label>
                     <input type="text" class="form-control" id="exampleInputQuantity" name="quantity" placeholder="Enter Quantity" required>
                  </div>
                   <div class="form-group">
                    <label for="exampleInputRate">Rate</label>
                     <input type="text" class="form-control" id="exampleInputrate" name="rate" placeholder="Enter Rate" required>
                  </div>
                  <div class="form-group">
                    <label for="exampleInputHouse">Supplier Name</label>
                    <input type="text" class="form-control" id="exampleInputgenericname" name="suppliername" placeholder="Enter Supplier Name" required>
                  
                  </div>
                </div>
              </div>
            </div>
          </div>
                <div class="card-footer">
                   {% if messages %}
        {% for message in messages %}
        <p style="color:green;">{{message}}</p> 
        {% endfor %}
        {% endif %}
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>
              </form>
            <!-- /.card-body -->
          </div>
          <!-- /.card -->
        </div>
     
      </div>

      
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->
  
<script>
  function validateManufactureDate() {
      var manufactureDateInput = document.getElementById('exampleInputMfgDate');
      var currentDate = new Date();

      if (new Date(manufactureDateInput.value) > currentDate) {
          alert('Manufacture Date should be before or equal to the current date.');
          manufactureDateInput.value = '';  // Clear the input
      }
  }

  function validateExpiryDate() {
      var expiryDateInput = document.getElementById('exampleInputExpDate');
      var currentDate = new Date();

      if (new Date(expiryDateInput.value) <= currentDate) {
          alert('Expiry Date should be after the current date.');
          expiryDateInput.value = '';  // Clear the input
      }
  }
</script>

<!-- <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> -->

<script>
    $(document).ready(function() {
        $('#item').change(function() {
            var itemId = $(this).val();
            $.ajax({
                url: '/itemdetails_get_base_units/',
                type: 'GET',
                data: { item_id: itemId },
                success: function(response) {

                  $('#bsunty').html('<option value="' + response.itmbsid + '">' + response.base_unit + ' (' + response.base_quantity + ')' + '</option>');
                  },
                error: function(xhr, status, error) {
                    console.error(xhr.responseText);
                }
            });
        });
    });
</script>


{% endblock %}
