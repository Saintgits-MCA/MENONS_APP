{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="content-wrapper">

  <!-- Page Header -->
  <section class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h1>Patient Details</h1>
        </div>
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item">
              {% if ptdtmngadd == '1' %}
              <a href="{% url 'patientdetails' %}?menumanagement_id={{ idmngmnt }}">
                Add
              </a>
              {% endif %}
            </li>
            <li class="breadcrumb-item active">Patient Details</li>
          </ol>
        </div>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <section class="content">
    <div class="container-fluid">

      <!-- 🔍 Unified Search Card -->
      <div class="card mb-3">
        <div class="card-body">
          <div class="row align-items-end">

            <!-- Single Search Input -->
            <div class="col-md-6">
              <label for="global_search">🔍 Search Patients across all branches (Name or Phone)</label>
              <div class="input-group">
                <input type="text" 
                       id="global_search" 
                       class="form-control"
                       placeholder="Enter patient name or phone number..."
                       value="{{ request.GET.global_search|default:'' }}"
                       autocomplete="off">
                <div class="input-group-append">
                  <button type="button" id="clear_search" class="btn btn-outline-secondary" title="Clear search">
                    <i class="fas fa-times"></i>
                  </button>
                </div>
              </div>
              
            </div>

            <!-- Action Buttons -->
            <div class="col-md-6 d-flex justify-content-md-end">
              <button type="button" id="search_btn" class="btn btn-primary mr-2">
                <i class="fas fa-search"></i> Search
              </button>
              <button type="button" id="reset_btn" class="btn btn-secondary">
                <i class="fas fa-undo"></i> Reset
              </button>
            </div>

          </div>
        </div>
      </div>

      <!-- 📋 Table Card -->
      <div class="card">
        <div class="card-body">
          <table id="patientdttable"
                 class="table table-bordered table-striped">
            <thead>
              <tr>
                <th>SL No</th>
                <th>MRNo</th>
                <th>Patient Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Address</th>
                <th>Branch</th>
                <th>Country</th>
                <th>State</th>
                <th>District</th>
                <th>Contact No</th>
                <th>Consultation Type</th>
                <th>Date</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- Search Info Badge -->
      <div class="mt-2" id="search_status"></div>

    </div>
  </section>
</div>

<!-- Delete Confirmation -->
<script>
function confirmDelete(event, url) {
  event.preventDefault();
  if (confirm("Are you sure you want to delete this Patient record?")) {
    window.location.href = url;
  }
}
</script>

<!-- DataTable Script -->
<!-- DataTable Script -->
<script>
$(document).ready(function () {

  var table = $("#patientdttable").DataTable({
    responsive: true,
    processing: true,
    serverSide: true,
    pageLength: 20,
    order: [[12, 'desc']], // Sort by Date descending

    // ✅ Required for Buttons
    dom: 'Bfrtip',

    buttons: [
      {
        extend: 'copy',
        exportOptions: {
          columns: ':visible:not(:last-child)'
        }
      },
      {
        extend: 'csv',
        exportOptions: {
          columns: ':visible:not(:last-child)'
        }
      },
      {
        extend: 'excel',
        exportOptions: {
          columns: ':visible:not(:last-child)'
        }
      },
      {
        extend: 'pdf',
        exportOptions: {
          columns: ':visible:not(:last-child)'
        }
      },
      {
        extend: 'print',
        exportOptions: {
          columns: ':visible:not(:last-child)'
        }
      },
      {
        extend: 'colvis'
      }
    ],

    ajax: {
      url: "{% url 'patientallbranchdetailtable_data' %}",
      type: "GET",
      data: function (d) {
        d.global_search = $("#global_search").val().trim();
      },
      error: function(xhr, error, thrown) {
        console.error("DataTable AJAX Error:", error);
        if (xhr.status === 401) {
          alert("Session expired. Please login again.");
          window.location.href = "{% url 'staff_login' %}";
        } else if (xhr.status === 404) {
          alert("Staff not found. Please contact administrator.");
        } else {
          alert("Error loading data. Please try again.");
        }
      }
    },

    columns: [
      { data: "sl_no", orderable: false },
      { data: "Medical_Record_Number" },
      { data: "Patient_Name" },
      { data: "Age" },
      { data: "Gender" },
      { data: "address" },
      { data: "branch" },
      { data: "Country_Name" },
      { data: "State_Name" },
      { data: "district" },
      { data: "contactno" },
      { data: "consultation_type", orderable: false },
      { data: "Date" },
      { data: "action", orderable: false, searchable: false },
    ],

    language: {
      emptyTable: "No patient records found",
      processing: "<i class='fas fa-spinner fa-spin'></i> Loading...",
      search: "Filter Patients:",
      paginate: {
        first: "First",
        last: "Last",
        next: "Next",
        previous: "Prev"
      }
    }
  });

  // 🔘 Search Button
  $("#search_btn").on("click", function () {
    updateSearchStatus();
    table.ajax.reload(null, true);
  });

  // ↵ Enter Key Search
  $("#global_search").on("keypress", function (e) {
    if (e.which === 13) {
      e.preventDefault();
      updateSearchStatus();
      table.ajax.reload(null, true);
    }
  });

  // 🔄 Reset Button
  $("#reset_btn").on("click", function () {
    $("#global_search").val("");
    $("#search_status").html("");
    table.ajax.reload(null, true);
  });

  // ❌ Clear Button
  $("#clear_search").on("click", function () {
    $("#global_search").val("").focus();
    $("#search_status").html("");
    table.ajax.reload(null, true);
  });

  // 📊 Update Search Status
  function updateSearchStatus() {
    var query = $("#global_search").val().trim();
    if (query) {
      $("#search_status").html(
        '<span class="badge badge-info">' +
        '<i class="fas fa-search"></i> Searching: "' + query + '" in Name & Phone' +
        '</span>'
      );
    } else {
      $("#search_status").html("");
    }
  }

  // 📈 After Draw
  table.on('draw.dt', function() {
    var info = table.page.info();
    var query = $("#global_search").val().trim();
    
    if (query && info.recordsDisplay > 0) {
      $("#search_status").html(
        '<span class="badge badge-success">' +
        '<i class="fas fa-check"></i> ' + info.recordsDisplay + 
        ' result(s) found for "' + query + '"' +
        '</span>'
      );
    } else if (query && info.recordsDisplay === 0) {
      $("#search_status").html(
        '<span class="badge badge-warning">' +
        '<i class="fas fa-exclamation"></i> No results found for "' + query + '"' +
        '</span>'
      );
    }
  });

});
</script>

{% endblock %}
