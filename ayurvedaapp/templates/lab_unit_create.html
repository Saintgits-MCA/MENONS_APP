{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="content-wrapper">

  <section class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6"><h1>Create Lab Unit</h1></div>
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item"><a href="{% url 'lab_unit_list' %}">View Units</a></li>
            <li class="breadcrumb-item active">Create Unit</li>
          </ol>
        </div>
      </div>
    </div>
  </section>

  <section class="content">
    <div class="row">
      <div class="col-md-8">
        <div class="card card-primary">
          <div class="card-header"><h3 class="card-title">Create Unit</h3></div>

          <form method="POST" action="{% url 'lab_unit_create' %}">
            {% csrf_token %}
            <div class="card-body">

              {% if messages %}
                {% for message in messages %}
                  <div class="alert alert-info">{{ message }}</div>
                {% endfor %}
              {% endif %}

              <div class="form-group">
                <label>Unit</label>
                <input type="text" class="form-control" name="unit_name" placeholder="Enter Unit" required>
              </div>

            </div>

            <div class="card-footer">
              <button type="submit" class="btn btn-primary">Save</button>
              <a href="{% url 'lab_unit_list' %}" class="btn btn-secondary">Cancel</a>
            </div>

          </form>
        </div>
      </div>
    </div>
  </section>

</div>

{% endblock %}
