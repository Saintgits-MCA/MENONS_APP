{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="content-wrapper">
    <section class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6">
                    <h1>Edit Diet</h1>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-right">
                        <li class="breadcrumb-item">
                            {% if diet_view == '1' %}
                                <a href="{% url 'diettable' %}?menumanagement_id={{ idmngmnt }}">View All</a>
                            {% endif %}
                        </li>
                        <li class="breadcrumb-item active">Edit Diet</li>
                    </ol>
                </div>
            </div>
        </div>
    </section>

    <section class="content">
        <div class="row">
            <div class="col-md-8">
                <div class="card card-primary">
                    <div class="card-header">
                        <h3 class="card-title">Edit Diet Form</h3>
                    </div>
                    <form method="POST" action="{% url 'edit_diet' %}">
                        {% csrf_token %}
                        <div class="card-body">
                            <input type="hidden" name="diet_id" value="{{ obj_diet.id }}">

                            <div class="form-group">
                                <label for="dietName">Diet Name</label>
                                <input type="text" class="form-control" id="dietName" name="name" 
                                       value="{{ obj_diet.name }}" placeholder="Enter Diet Name" required>
                            </div>
                            <div class="form-group">
                                <label for="dietDescription">Description</label>
                                <textarea class="form-control" id="dietDescription" name="description"
                                          placeholder="Enter Description" rows="4">{{ obj_diet.description }}</textarea>
                            </div>
                        </div>
                        <div class="card-footer">
                            {% if messages %}
                                {% for message in messages %}
                                    <p style="color:green;">{{ message }}</p>
                                {% endfor %}
                            {% endif %}
                            <button type="submit" class="btn btn-primary">Update</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</div>

{% endblock %}
