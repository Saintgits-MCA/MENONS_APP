{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="content-wrapper">

    <section class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6">
                    <h1>IP Conversion Details</h1>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-right">
                        <li class="breadcrumb-item">
                            {% if mngview == '1' %}
                                <a href="{% url 'appointmenttable' %}?menumanagement_id={{ idmngmnt }}">View</a>
                            {% endif %}
                        </li>
                        <li class="breadcrumb-item active">Patient Admission</li>
                    </ol>
                </div>
            </div>
        </div>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="row">
            <div class="col-md-12">
                <div class="card card-primary">
                    <div class="card-header">
                        <h3 class="card-title">Patient Admission</h3>
                        <div class="card-tools">
                            <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                                <!-- <i class="fas fa-minus"></i> -->
                            </button>
                        </div>
                    </div>
                    <form method="POST" action="{% url 'ipconvertion' %}?menumanagement_id={{idmngmnt}}">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-body">
                                        <div class="form-group">
                                            <label for="mrSearch">MR Number</label>
                                            <input type="text" id="mrSearch" class="form-control" placeholder="Type MR Number">
                                            <select class="form-control" name="mrnum" id="mrDropdown" required>
                                                <option selected disabled value="">Select</option>
                                            </select>
                                        </div>
                                        <div class="form-group">
                                            <label for="FirstName">Patient Name</label>
                                            <input type="text" class="form-control" id="FirstName"  placeholder="Enter Patient Name" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="exampleInputAddress">Patient Address</label>
                                            <input type="text" id="exampleInputAddress" class="form-control">
                                        </div>
                                        <div class="form-group">
                                            <label for="exampleInputContactNo">Contact No</label>
                                            <input type="text" class="form-control" id="exampleInputContactNo" name="contactnum" placeholder="Enter Contact No">
                                        </div>
                                    </div>
                                </div>
                            </div>  
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-body">
                                        
                                        <div class="form-group">
                                            <label for="exampleInputdate">Admitted Date</label>
                                            <input type="date" class="form-control" id="exampleInputdate" name="admtdate" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="exampleInputManagerName">Status</label>
                                            <br>
                                            <input type="radio" value="1" checked="checked" name="iporop" id="statusInactive">
                                            <label for="statusInactive">IP</label>
                                            <input type="radio" value="0"  name="iporop" id="statusActive">
                                            <label for="statusActive">OP</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            {% if messages %}
                                {% for message in messages %}
                                    <p style="color:green;">{{message}}</p> 
                                {% endfor %}
                            {% endif %}
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

</div>

<!-- jQuery and AJAX scripts -->
<!-- <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script> -->
<script>
    $(document).ready(function () {
        function updatePatientDetails() {
            var selectedMrNumber = $("#mrDropdown").val();

            $.ajax({
                type: "GET",
                url: "{% url 'getmrdetails' %}",
                data: { mrNumber: selectedMrNumber },
                success: function (data) {
                    $("#FirstName").val(data.Patient_Name);
                    $("#exampleInputAddress").val(data.Housename);
                    $("#age").val(data.age);
                    $("#exampleInputContactNo").val(data.phno);
                },
                error: function (xhr, status, error) {
                    console.error("Error fetching patient details:", error);
                },
            });
        }

        $("#mrSearch").on('input', function() {
            var query = $(this).val();
            if (query.length >= 2) {
                $.ajax({
                    type: 'GET',
                    url: "{% url 'search_mrno' %}",
                    data: { query: query },
                    success: function(data) {
                        var dropdown = $('#mrDropdown');
                        dropdown.empty();
                        if (data.length > 0) {
                            data.forEach(function(item) {
                                dropdown.append('<option value="' + item.id + '">' + item.Medical_Record_Number + '</option>');
                            });
                            dropdown.val(data[0].id);
                        } else {
                            dropdown.append('<option selected disabled value="">No matching MR numbers found</option>');
                        }
                    }
                });
            }
        });

        $("#mrDropdown").on("change", updatePatientDetails);
    });
</script>
<script>
    $(document).ready(function () {
    
      // Function to update patient details based on selected MR Number
      function updatePatientDetails(selectedMrNumber) {
        $.ajax({
          type: "GET",
          url: "{% url 'getmrdetails' %}",  // Update this URL based on your project structure
          data: { mrNumber: selectedMrNumber },
          success: function (data) {
            var combinedDetails = `${data.Patient_Name}, ${data.phno}, ${data.place}`;
            $("#exampleInputAddress").val(combinedDetails);  // Update the input field with the combined details
          },
          error: function (xhr, status, error) {
            console.error("Error fetching patient details:", error);
            $("#exampleInputAddress").val("Error fetching details. Please try again.");
          }
        });
      }
    
      // Trigger patient details update when MR Number dropdown changes
      $("#mrDropdown").on("change", function() {
        var selectedMrNumber = $(this).val();
        if (selectedMrNumber) {
          updatePatientDetails(selectedMrNumber);
        }
      });
    
      // Search MR Numbers and update the dropdown dynamically based on input
      $('#mrSearch').on('keyup', function() {
        var query = $(this).val();
        if (query.length >= 2) {  // Start searching after 2 characters
          $.ajax({
            type: 'GET',
            url: "{% url 'search_mrno' %}",  // Update with the correct URL
            data: { query: query },
            success: function(data) {
              var dropdown = $('#mrDropdown');
              dropdown.empty().append('<option selected disabled value="">Select</option>');  // Reset dropdown
    
              if (data.length > 0) {
                data.forEach(function(item) {
                  dropdown.append(`<option value="${item.id}">${item.Patient_Name} -> ${item.Medical_Record_Number}</option>`);
                });
                // Automatically select the first matching MR number and display details
                var firstMrNumber = data[0].id;
                dropdown.val(firstMrNumber);  // Select the first matching MR number
                updatePatientDetails(firstMrNumber);  // Update patient details for the selected MR number
              } else {
                dropdown.append('<option selected disabled value="">No matching MR numbers found</option>');
                $("#exampleInputAddress").val("");  // Clear patient details if no matches
              }
            },
            error: function (xhr, status, error) {
              console.error("Error fetching MR numbers:", error);
              $('#mrDropdown').empty().append('<option selected disabled value="">Error fetching data. Please try again.</option>');
              $("#exampleInputAddress").val("");  // Clear patient details on error
            }
          });
        } else {
          $("#mrDropdown").empty().append('<option selected disabled value="">Select</option>');  // Clear dropdown if query is too short
          $("#exampleInputAddress").val("");  // Clear patient details
        }
      });
    });
    </script>
{% endblock %}
