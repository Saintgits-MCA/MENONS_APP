{% extends 'base.html' %}
{% load static %}
{% block content %}


  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1>Department Details</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item">
                {%if dptview == '1'%}
                <a href="{% url 'departmenttable' %}?menumanagement_id={{idmngmnt}}">View</a>
              {%endif%}</li>
              <li class="breadcrumb-item active">Department</li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">

      <div class="row">
        <div class="col-md-8">
          <div class="card card-primary">
            <div class="card-header">
              <h3 class="card-title">Department</h3>

              <div class="card-tools">
                <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                  <!-- <i class="fas fa-minus"></i> -->
                </button>
              </div>
            </div>
               <form method="POST", action="{% url 'editdepartment' %}?menumanagement_id={{idmngmnt}}">
             
                {% csrf_token %}
                
      <div class="row">
          <!-- <div class="col-lg-6" >
              <div class="card"> -->
                <div class="card-body" >
              
                  <div class="form-group">
                   <label for="exampleInputBranchName">Department Name</label><input type="hidden" name="dptid" value="{{objeddeprt.id}}">
                    <input type="text" class="form-control" id="exampleInputAddress" name="departmentname" placeholder="Enter Department Name" value="{{objeddeprt.Department_Name}}"> 
                    
                  </div>
                  <div class="form-group">
                    <label for="exampleInputBranchName">Flag</label><input type="hidden" name="flg" >
                    <br>
                    <input type="radio" id="maleRadio" name="flg" value="1" {% if objeddeprt.flag == 1 %}checked{% endif %}>
                    <label for="maleRadio">True</label>
                
                    <input type="radio" id="femaleRadio" name="flg" value="0" {% if objeddeprt.flag == 0 %}checked{% endif %}>
                    <label for="femaleRadio">False</label>
                
                   </div>
                  
                </div>
        
             
          </div>
              <div class="card-footer">
                {% if messages %}
        {% for message in messages %}
        <p style="color:green;">{{message}}</p> 
        {% endfor %}
        {% endif %}
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>

              </form>
          
            <!-- /.card-body -->
          </div>
          <!-- /.card -->
        </div>
     
      </div>

      
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->

 {% endblock %}
