{% extends 'base.html' %}
{% load static %}
{% block content %}



  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1>Reorder Level Details</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
             
              <li class="breadcrumb-item active">Reorder Level</li>
            </ol>
          </div>
        </div>
      </div>
      <!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">

      <div class="row">
        <div class="col-md-12">
          <div class="card card-primary">
            <div class="card-header">
              <h3 class="card-title">Reorder Level</h3>

              <div class="card-tools">
                <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                  <!-- <i class="fas fa-minus"></i> -->
                </button>
                
              </div>
            </div>
             <form method="POST", action="{% url 'inveditreorder' %}">
                {% csrf_token %}
      <div class="row">
          <div class="col-md-6">
              <div class="card">
             
                <div class="card-body">
                
                <div class="form-group">
                    <label for="exampleInputEmail1">Medicine Company</label>
                   
                    <select class="form-control" id="mdcompany" name="mdcompany" required>
                      <option  selected disabled value="">Select</option>
                         {% for i in comp %}
                              <option value="{{i.id}}" {% if i.id == ordt.companyid_id %}selected{% endif %}>{{i.Comapany_name}}</option>
                          {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                   <label for="exampleInputEmail1">Item</label> 
                     
                    <select class="form-control" id="item" name="item" required>
                      <option  selected disabled value="">Select</option>
                         {% for i in medname %}
                              <option value="{{i.id}}" {% if i.id == ordt.itemname_id %}selected{% endif %}>{{i.itemnm}}</option>
                          {% endfor %}
                    </select>
                    </div>
                    <div class="form-group">
                        <label for="exampleInputEmail1">Quantity</label>
                        <input type="hidden" class="form-control"  name="id" value="{{ordt.id}}" >
                  
                        <input type="text" class="form-control" id="qty" name="qty" value="{{ordt.qty}}" required>
                    </div>

                 
                </div>
              </div>
            </div>
                
            
          </div>
        
                <div class="card-footer">
                    {% if messages %}
                            {% for message in messages %}
                            <p style="color:green;">{{message}}</p> 
                            {% endfor %}
                    {% endif %}
                  <button type="submit" class="btn btn-primary">Submit</button>
                
                </div>
              </form>
            <!-- /.card-body -->
          </div>
          <!-- /.card -->
        </div>
     
      </div>

      
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->
  
   
  
 {% endblock %}
