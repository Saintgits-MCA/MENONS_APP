{% extends 'base.html' %}
{% load static %}
{% block content %}

<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6">
                    <h1>Appointment Status</h1>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-right">
                        <li class="breadcrumb-item"><a href="{% url 'appointment_status_list' %}?menumanagement_id={{ menu_management_id }}">View All</a></li>
                        <li class="breadcrumb-item active">Add Appointment Status</li>
                    </ol>
                </div>
            </div>
        </div>
    </section>

    <!-- Main content -->
    <section class="content">
        <div class="row">
            <div class="col-md-8">
                <div class="card card-primary">
                    <div class="card-header">
                        <h3 class="card-title">Add Appointment Status</h3>
                        <div class="card-tools">
                            <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                                <!-- <i class="fas fa-minus"></i> -->
                            </button>
                        </div>
                    </div>
                    <form method="POST" action="{% url 'add_appointment_status' %}?menumanagement_id={{ menu_management_id }}">
                        {% csrf_token %}
                        <div class="card-body">
                            <div class="form-group">
                                <label for="statusName">Status Name</label>
                                <input type="text" class="form-control" id="statusName" name="status_name" placeholder="Enter Status Name" required>
                            </div>
                            <div class="form-group">
                                <label>Status</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="is_active" id="activeRadio" value="1" checked>
                                    <label class="form-check-label" for="activeRadio">
                                        Active
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="is_active" id="inactiveRadio" value="0">
                                    <label class="form-check-label" for="inactiveRadio">
                                        Inactive
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            {% if messages %}
                                {% for message in messages %}
                                    <p style="color:green;">{{ message }}</p>
                                {% endfor %}
                            {% endif %}
                            <button type="submit" class="btn btn-primary">Submit</button>
                            <a href="{% url 'appointment_status_list' %}?menumanagement_id={{ menu_management_id }}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</div>

{% endblock %}
