{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="content-wrapper">
  <section class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6"><h1>Change Room / Ward</h1></div>
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item">
          
                <a href="{% url 'changeroompatientdetails' %}">View All</a>
            
            </li>
            <li class="breadcrumb-item active">Change Room / Ward</li>
          </ol>
        </div>
      </div>
    </div>
  </section>

  <section class="content">
    <div class="row">
      <div class="col-md-12">
        <div class="card card-primary">
          <div class="card-header">
            <h3 class="card-title">Change Room / Ward</h3>
          </div>

          <div class="container mt-4">
            <form method="POST",action="{%url 'changeroom' %}">
              {% csrf_token %}
              <div class="row">
                <div class="col-md-8">
                  <div class="form-group">
                    <label for="mrSearch">MR Number/PhoneNo/Name</label>
                    <input type="text" id="mrSearch" class="form-control" placeholder="Type MR Number">
                  </div>
                </div>
                <div class="col-md-4 mt-4">
                  <button type="button" id="searchBtn" class="btn btn-primary">Search</button>
                </div>
              </div>

              <!-- Patient Selection -->
              <div class="form-group">
                <label for="patient">Select Patient (Admitted)</label>
                <select name="ipno" id="patient" class="form-control" required>
                  <option value="">-- Select Patient --</option>
                  {% for booking in ipdt %}
                    <option value="{{ booking.id }}">{{ booking.MR_Number.Patient_Name }} (IP No: {{ booking.id }})</option>
                  {% endfor %}
                </select>
              </div>

              <!-- Current Room Info -->
              <div id="currentRoomDetails" class="mt-3 mb-3"></div>

              <!-- Accommodation Selection -->
              <div class="form-group">
                <label>Select Accommodation Type:</label><br>
                <input type="radio" value="Ward" name="accommodation" id="accommodationWard" required>
                <label for="accommodationWard">Ward</label>

                <input type="radio" value="Room" name="accommodation" id="accommodationRoom" class="ml-3" required>
                <label for="accommodationRoom">Room</label>
              </div>

              <div class="form-group">
                <label>Remark:</label>
                <textarea class="form-control" name="remarks"></textarea>
              </div>

              <!-- Room Selection -->
              <div id="roomSelection" style="display: none;">
                <div class="form-group">
                  <label for="roomtype">Room Type</label>
                  <select class="form-control" name="roomtype" id="roomtype">
                    <option value="">Select Room Type</option>
                    {% for i in unique_room_types %}
                      <option value="{{ i }}">{{ i }}</option>
                    {% endfor %}
                  </select>
                </div>

                <div class="form-group">
                  <label for="roommnumber">Room Number</label>
                  <select class="form-control" name="roommnumber" id="roommnumber">
                    <option value="">Select Room Number</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="roomfloor">Floor Number</label>
                  <input type="text" class="form-control" id="roomfloor" name="roomfloor" readonly>
                </div>
              </div>

              <!-- Ward Selection -->
              <div id="wardSelection" style="display: none;">
                <div class="form-group">
                  <label for="wardbedno">Available Bed Number</label>
                  <select class="form-control" name="wardbedno" id="wardbedno">
                    <option value="">Select Bed Number</option>
                    {% for bed in available_wards %}
                      <option value="{{ bed.id }}" data-floor="{{ bed.Floorno }}">{{ bed.wardbedno }}</option>
                    {% endfor %}
                  </select>
                </div>

                <div class="form-group">
                  <label for="wardfloor">Floor Number</label>
                  <input type="text" class="form-control" id="wardfloor" name="wardfloor" readonly>
                </div>
              </div>

              <button type="submit" class="btn btn-primary mt-3">Change Room</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- Search Modal -->
<div class="modal fade" id="searchModal" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Search Results</h5>
        <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
      </div>
      <div class="modal-body">
        <table id="searchResultsTable" class="display table table-bordered">
          <thead>
            <tr>
              <th>MR Number</th>
              <th>Patient Name</th>
              <th>Contact No</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody><!-- Populated by script --></tbody>
        </table>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script>
$(document).ready(function () {
  // Accommodation toggle
  $("input[name='accommodation']").change(function () {
    let selectedType = $(this).val();
    if (selectedType === "Room") {
      $("#roomSelection").show();
      $("#wardSelection").hide();
    } else {
      $("#roomSelection").hide();
      $("#wardSelection").show();
    }
  });

  // Load room numbers
  $("#roomtype").change(function () {
    let roomType = $(this).val();
    if (roomType) {
      $.ajax({
        url: "{% url 'get_available_accommodations' %}",
        data: { accommodation_type: "Room", room_type: roomType },
        dataType: "json",
        success: function (data) {
          let roomDropdown = $("#roommnumber");
          let floorInput = $("#roomfloor");
          roomDropdown.empty().append('<option value="">Select Room Number</option>');
          floorInput.val("");
          if (data.rooms.length > 0) {
            $.each(data.rooms, function (index, room) {
              roomDropdown.append(`<option value="${room.id}">${room.Roomno}</option>`);
            });
            floorInput.val(data.rooms[0].Floorno);
          }
        },
      });
    }
  });

  // Load ward beds
  $("input[name='accommodation']").change(function () {
    if ($(this).val() === "Ward") {
      $.ajax({
        url: "{% url 'get_available_accommodations' %}",
        data: { accommodation_type: "Ward" },
        dataType: "json",
        success: function (data) {
          let bedDropdown = $("#wardbedno");
          let floorInput = $("#wardfloor");
          bedDropdown.empty().append('<option value="">Select Bed Number</option>');
          floorInput.val("");
          if (data.beds.length > 0) {
            $.each(data.beds, function (index, bed) {
              bedDropdown.append(`<option value="${bed.id}">${bed.wardbedno}</option>`);
            });
            floorInput.val(data.beds[0].Floorno);
          }
        },
      });
    }
  });

  // Load current room info on patient change
  $('#patient').change(function () {
    const ipno = $(this).val();
    if (ipno) {
      $.ajax({
        url: "{% url 'get_current_room_info' %}",
        data: { ipno: ipno },
        success: function (data) {
          $('#currentRoomDetails').html(`
            <div class="alert alert-info">
              <h5>Current Accommodation Details</h5>
              <strong>Type:</strong> ${data.accommodation_type || 'N/A'}<br>
              <strong>Room/Ward No:</strong> ${data.room_number || data.bed_number || 'N/A'}<br>
              <strong>Floor:</strong> ${data.floor_number || 'N/A'}<br>
              <strong>Branch:</strong> ${data.branch || 'N/A'}<br>
              <hr>
              <strong>Rate/Day:</strong> ₹${data.rate_per_day || '0.00'}<br>
              <strong>No. of Days Stayed:</strong> ${data.no_of_days || '1'}<br>
              <strong>Total Room Charges:</strong> ₹${data.total_room_charge || '0.00'}
            </div>
          `);
        },
        error: function () {
          $('#currentRoomDetails').html('<div class="alert alert-danger">Unable to fetch current room details.</div>');
        }
      });
    } else {
      $('#currentRoomDetails').html('');
    }
  });

  // Initialize datatable
  let searchResultsTable = $('#searchResultsTable').DataTable();

  // Search button handler
  $('#searchBtn').on('click', function () {
    let query = $('#mrSearch').val().trim();
    if (!query) return alert('Please enter a search term.');
    fetch(`/ipsearch_mrno?query=${query}`)
      .then(response => response.json())
      .then(data => {
        searchResultsTable.clear().draw();
        if (data.length > 0) {
          data.forEach(item => {
            let actionBtn = `<button class="btn btn-primary select-btn"
              data-ipnoid="${item.ip_id}" data-name="${item.Patient_Name}">
              Select
            </button>`;
            searchResultsTable.row.add([
              item.Medical_Record_Number,
              item.Patient_Name,
              item.contactno || 'N/A',
              actionBtn
            ]).draw();
          });
          $('#searchModal').modal('show');
        } else {
          alert('No admitted patients with a room found.');
        }
      });
  });

  // Handle patient selection from modal
  $('#searchResultsTable tbody').on('click', '.select-btn', function () {
    const ipnoId = $(this).data('ipnoid');
    $('#patient').val(ipnoId).change();  // <-- Trigger fetch current room info
    $('#searchModal').modal('hide');
  });
});
</script>

{% endblock %}
