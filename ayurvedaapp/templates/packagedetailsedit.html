{% extends 'base.html' %}
{% load static %}
{% block content %}


  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1>Package Details</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="{% url 'packagetable'%}">View All</a></li>
              <li class="breadcrumb-item active">Package</li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">

      <div class="row">
        <div class="col-md-8">
          <div class="card card-primary">
            <div class="card-header">
              <h3 class="card-title">Package</h3>

              <div class="card-tools">
                <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                  <!-- <i class="fas fa-minus"></i> -->
                </button>
              </div>
            </div>
               <form method="POST", action="{% url 'editpackagedetails' %}">
             
                {% csrf_token %}
    
             
             
                <div class="card-body">
                    <div class="form-group">
                    <label for="exampleInputPackageName">Package Name</label><input type="hidden" name="pkgeid" value="{{objedpkgdtl.id}}">
                  <input type="text" class="form-control" id="exampleInputPackageName" name="packagename" placeholder="Enter Package Name"  value="{{objedpkgdtl.Package_Name}}">
                  </div>
                
           <div class="form-group">
                    <label for="exampleInputstatus">Treatments</label>
                     
                    <input type="text" class="form-control" id="exampleInputPackageName" name="selectedTreatments" placeholder="Enter Package Name"  value="{{objedpkgdtl.Treatment_name}}">
                 
                  </div>
                  

                  <div class="form-group">
                    <label for="exampleInputFrequency">Frequency</label>
                  <input type="text" class="form-control" id="exampleInputFrequency" name="frequency" placeholder="Enter Frequency " value="{{objedpkgdtl.Frequency}}">
                  </div>
                  
                 <div class="form-group">
                    <label for="exampleInputstatus">Branch Name</label>
                     <select class="form-control" name="branchname">
                        <option selected>Select</option>
                                        {% for i in branchobj %}

                     <option value="{{i.id}}" {% if i.id == objedpkgdtl.Branch_Name_id %}selected{% endif %}>{{i.Branch_Name}}</option>
                                        {% endfor %}
                      </select>
                    
                  </div>
                   <div class="form-group">
                    <label for="exampleInputFrequency">Package Rate</label>
                  <input type="text" class="form-control" id="exampleInputPackageRate" name="packagerate" placeholder="Enter Package Rate " value="{{objedpkgdtl.Package_rate}}">
                  </div>
                
                  
                  
                </div>
             
           
                <div class="card-footer">
                   {% if messages %}
        {% for message in messages %}
        <p style="color:green;">{{message}}</p> 
        {% endfor %}
        {% endif %}
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>
              </form>
            <!-- /.card-body -->
          </div>
          <!-- /.card -->
        </div>
     
      </div>

      
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->
{% endblock %}
