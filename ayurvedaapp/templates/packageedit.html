{% extends 'base.html' %}
{% load static %}
{% block content %}


  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1>Package Details</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
                {%if pckobjmngview == '1'%}
                <a href="{% url 'packageelementstable' %}?menumanagement_id={{ idmngmnt }}">View All</a>
            {%endif%}</li>
              <li class="breadcrumb-item active">Package</li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">

      <div class="row">
        <div class="col-md-8">
          <div class="card card-primary">
            <div class="card-header">
              <h3 class="card-title">Package</h3>

              <div class="card-tools">
                <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                  <!-- <i class="fas fa-minus"></i> -->
                </button>
              </div>
            </div>
               <form method="POST", action="{% url 'editpackage' %}?menumanagement_id={{ idmngmnt }}">
             
                {% csrf_token %}
    
             
             
                <div class="card-body">
                    <div class="form-group">
                        
                    <label for="exampleInputPackageName">Package Name</label>
                    <input type="hidden" name="packageid" value="{{ objpackage.id }}">

                  <input type="text" class="form-control" id="exampleInputPackageName" placeholder="Enter Package Name" name="packagename" value="{{ objpackage.packagename }}">
                  </div>
                
                 <div class="form-group">
                        <label>Description:</label>
                        <textarea  class="form-control" name="desc">{{ objpackage.packagedetails }}</textarea>
                            
                  </div>
                  

                  <div class="form-group">
                    <label>Rate:</label>
                    <input type="text" class="form-control" name="rate" value="{{ objpackage.rate }}">
                   </div>
                  
                 <div class="form-group">
                    <label for="exampleInputstatus">Branch Name</label>
                     <select class="form-control" name="branchname">
                        <option selected>Select</option>
                                        {% for i in branchdt %}

                     <option value="{{i.id}}" {% if i.id == objpackage.branchdt_id %}selected{% endif %}>{{objpackage.branchdt.Branch_Name}}</option>
                                        {% endfor %}
                      </select>
                    
                  </div>
                  
                    <div class="form-group">
                      <label for="exampleInputManagerName">Status</label>
                      <br>
                      <input type="radio"value="Active" name="exampleInputStatus" id="exampleInputStatus"  {% if objpackage.status == "Active" %}checked{% endif %}  required >
                      <label for="exampleInputManagerName">Active</label>
                      <input type="radio"value="Inactive"id="exampleInputStatus" name="exampleInputStatus"   {% if objpackage.status == "Inactive" %}checked{% endif %} required>
                      <label for="exampleInputManagerName">Inactive</label>
                    </div>
                     
                  
                  
                  
                </div>
             
           
                <div class="card-footer">
                   {% if messages %}
        {% for message in messages %}
        <p style="color:green;">{{message}}</p> 
        {% endfor %}
        {% endif %}
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>
              </form>
            <!-- /.card-body -->
          </div>
          <!-- /.card -->
        </div>
     
      </div>

      
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->
{% endblock %}
