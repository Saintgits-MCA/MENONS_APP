{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="content-wrapper">
    <section class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6">
                    <h1>Pre-Appointment Booking</h1>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-right">
                        <li class="breadcrumb-item"><a href="{% url 'pre_appointment_booking_list' %}?menumanagement_id={{ idmngmnt }}">Pre-Booking List</a></li>
                        <li class="breadcrumb-item active">Book</li>
                    </ol>
                </div>
            </div>
        </div>
    </section>

    <section class="content">
        <div class="row">
            <div class="col-md-12">
                <div class="card card-primary">
                    <div class="card-header">
                        <h3 class="card-title">Pre-Appointment Details</h3>
                        <div class="card-tools">
                            <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                                <!-- <i class="fas fa-minus"></i> -->
                            </button>
                        </div>
                    </div>

                    <!-- Toggle between Registered Patient and New Patient Registration -->
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-12">
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="patientType" id="existingPatient" value="existing" checked onchange="togglePatientType()">
                                    <label class="form-check-label" for="existingPatient">Existing Patient</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="patientType" id="newPatient" value="new" onchange="togglePatientType()">
                                    <label class="form-check-label" for="newPatient">New Patient Registration</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Existing Patient Section -->
                    <div id="existingPatientSection">
                        <form method="POST" action="{% url 'pre_appointment_booking' %}?menumanagement_id={{idmngmnt}}" id="preBookingForm">
                            {% csrf_token %}
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-8">
                                                <div class="form-group">
                                                    <label>MR Number/PhoneNo/Name</label>
                                                    <input type="text" id="mrSearch" class="form-control" placeholder="Type to search">
                                                </div>
                                            </div>
                                            <div class="col-md-4 mt-4">
                                                <a id="searchBtn" class="btn btn-primary text-white">Search</a>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label>Selected Patient</label>
                                            <select class="form-control" name="mrnum" id="mrDropdown" required>
                                                <option selected disabled value="">Select</option>
                                            </select>
                                        </div>
                                        <div class="form-group">
                                            <label>Appointment Date</label>
                                            <input type="date" class="form-control" name="apntdate" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="card-body">
                                        <div class="form-group">
                                            <label>Department</label>
                                            <select class="form-control" name="deptname" id="inputdept" required>
                                                <option selected disabled value="">Select</option>
                                                {% for i in departmentobj %}<option value="{{i.id}}">{{i.Department_Name}}</option>{% endfor %}
                                            </select>
                                        </div>
                                        <div class="form-group">
                                            <label>Designation Name</label>
                                            <select class="form-control" name="desgname" id="inputdesgn" required>
                                                <option selected disabled value="">Select</option>
                                                {% for i in designobj %}<option value="{{i.id}}">{{i.Designation_Name}}</option>{% endfor %}
                                            </select>
                                            <input type="hidden" value="{{request.session.branchid}}" name="branch" id="brch">
                                        </div>
                                        <div class="form-group">
                                            <label>Doctor Name</label>
                                            <select class="form-control" name="docname" id="docname" required>
                                                <option selected disabled value="">Select</option>
                                            </select>
                                        </div>
                                        <div class="form-group">
                                            <label>Status</label>
                                            <select class="form-control" name="status" required>
                                                <option value="" selected disabled>Select</option>
                                                {% for i in appointment_status %}<option value="{{i.status_name}}">{{i.status_name}}</option>{% endfor %}
                                            </select>
                                        </div>
                                        <div class="form-group">
                                            <label>Contact No</label>
                                            <input type="text" class="form-control" name="contactnum" id="contactnum">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="card-footer">
                                <button type="submit" class="btn btn-success">Save Pre-Booking</button>
                            </div>
                        </form>
                    </div>

                    <!-- New Patient Registration Section -->
                    <div id="newPatientSection" style="display: none;">
                        <form id="newPatientForm" method="POST" action="{% url 'patientdetails' %}?menumanagement_id={{ idmngmnt }}">
                            {% csrf_token %}
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="card">
                                        <div class="card-body">
                                            <div class="form-group">
                                                <label>Patient Name <span class="text-danger">*</span></label>
                                                <input type="text" class="form-control" id="newPatientName" name="patientname" placeholder="Enter Patient Name" required>
                                            </div>
                                            <div class="form-group">
                                                <label>Age</label>
                                                <input type="text" class="form-control" id="newPatientAge" name="age" placeholder="Enter Age">
                                            </div>
                                            <div class="form-group">
                                                <label>Gender <span class="text-danger">*</span></label>
                                                <br>
                                                <input type="radio" value="Male" name="gender" id="newGenderMale" required>
                                                <label for="newGenderMale">Male</label>
                                                <input type="radio" value="Female" id="newGenderFemale" name="gender" required>
                                                <label for="newGenderFemale">Female</label>
                                                <input type="radio" value="Others" id="newGenderOthers" name="gender" required>
                                                <label for="newGenderOthers">Others</label>
                                            </div>
                                            <div class="form-group">
                                                <label>Date</label>
                                                <input type="date" class="form-control" id="newPatientDate" name="patient_date" required>
                                            </div>
                                            <div class="form-group">
                                                <label>Email</label>
                                                <input type="text" class="form-control" id="newPatientEmail" name="email" placeholder="Enter Email">
                                            </div>
                                            <div class="form-group">
                                                <label>Contact no <span class="text-danger">*</span></label>
                                                <input type="text" class="form-control" id="newPatientContact" name="contactnumber" placeholder="Enter Contact no" required>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="card">
                                        <div class="card-body">
                                            <div class="form-group">
                                                <label>Address</label>
                                                <textarea id="newPatientAddress" class="form-control" name="address"></textarea>
                                            </div>
                                            <div class="form-group">
                                                <label for="newPatientCountry">Country</label>
                                                <select class="form-control" name="country" id="newPatientCountry">
                                                    <option selected disabled value="">Select Country</option>
                                                    {% for i in countryobj %}
                                                    <option value="{{ i.id }}">{{ i.Country_Name }}</option>
                                                    {% endfor %}
                                                </select>
                                            </div>
                                            <div class="form-group">
                                                <label for="newPatientState">State</label>
                                                <select class="form-control" name="state" id="newPatientState">
                                                    <option selected disabled value="">Select State</option>
                                                    {% for i in stateobj %}
                                                    <option value="{{ i.id }}">{{ i.State_Name }}</option>
                                                    {% endfor %}
                                                </select>
                                            </div>
                                            <div class="form-group">
                                                <label>District</label>
                                                <input type="text" class="form-control" id="newPatientDistrict" name="district" placeholder="Enter district">
                                            </div>
                                            <div class="form-group">
                                                <label>Consultation Type</label><br>
                                                <input type="radio" value="offline" name="consultation_type" id="consultOffline" checked>
                                                <label for="consultOffline">Offline</label>
                                                <input type="radio" value="online" name="consultation_type" id="consultOnline">
                                                <label for="consultOnline">Online</label>
                                            </div>
                                            <input type="hidden" name="redirect_to_prebooking" value="true" id="redirectToPrebooking">
                                            <input type="hidden" name="reg_Fee" value="0">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="card-footer">
                                <button type="button" class="btn btn-primary" onclick="submitNewPatient()">Register & Continue</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<!-- Search Modal -->
<div class="modal fade" id="searchModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Search Results</h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <table id="searchResultsTable" class="display table table-bordered">
                    <thead>
                        <tr>
                            <th>MR Number</th>
                            <th>Patient Name</th>
                            <th>Contact No</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // Global variable to store new patient data
    var newPatientData = null;

    $(document).ready(function () {
        // Set current date for new patient form
        var today = new Date();
        var dd = String(today.getDate()).padStart(2, '0');
        var mm = String(today.getMonth() + 1).padStart(2, '0');
        var yyyy = today.getFullYear();
        var formattedDate = yyyy + '-' + mm + '-' + dd;
        document.getElementById('newPatientDate').value = formattedDate;

        // Initialize DataTable for search results
        let table = $('#searchResultsTable').DataTable({
            paging: true,
            searching: true,
            info: true,
            pageLength: 10
        });

        // Search button click
        $('#searchBtn').on('click', function() {
            let query = $('#mrSearch').val();
            if (query.trim() === '') {
                alert('Please enter a search term.');
                return;
            }
            table.clear().draw();
            fetch(`{% url 'search_mrno' %}?query=${query}`)
                .then(response => response.json())
                .then(data => {
                    if (data.length > 0) {
                        data.forEach(item => {
                            let actionBtn = `<a class="btn btn-primary select-btn text-white" data-id="${item.id}" data-name="${item.Patient_Name}" data-mrno="${item.Medical_Record_Number}" data-contact="${item.contactno}">Select</a>`;
                            table.row.add([item.Medical_Record_Number, item.Patient_Name, item.contactno, actionBtn]).draw(false);
                        });
                        $('#searchModal').modal('show');
                    } else {
                        alert('No matching records found.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while searching.');
                });
        });

        // Select patient from search results
        $('#searchResultsTable tbody').on('click', '.select-btn', function() {
            let id = $(this).data('id');
            let mrno = $(this).data('mrno');
            let name = $(this).data('name');
            let contact = $(this).data('contact');
            $('#mrDropdown').html(`<option value="${id}" selected>${mrno} - ${name}</option>`);
            $('#contactnum').val(contact);
            $('#searchModal').modal('hide');
        });

        // Get doctors based on branch, department, designation
        $('#brch, #inputdept, #inputdesgn').on('change', function() {
            var brch = $('#brch').val();
            var desg = $('#inputdesgn').val();
            var dept = $('#inputdept').val();
            var dropdown = $('#docname');
            dropdown.empty().append('<option selected disabled>Loading...</option>');
            if (brch && desg && dept) {
                $.ajax({
                    type: 'GET',
                    url: "{% url 'get_staff_by_branch_and_designation' %}",
                    data: { branch: brch, designation: desg, department: dept },
                    success: function(data) {
                        dropdown.empty().append('<option selected disabled>Select</option>');
                        if (data.length > 0) {
                            data.forEach(function(item) {
                                dropdown.append(`<option value="${item.Staff_id}">${item.Staff_firstname} ${item.Staff_lastname} - ${item.deprt}</option>`);
                            });
                        } else {
                            dropdown.append('<option selected disabled>No staff found</option>');
                        }
                    },
                    error: function() {
                        dropdown.empty().append('<option selected disabled>Error loading doctors</option>');
                    }
                });
            }
        });

        // Handle Enter key for search
        $('#mrSearch').on('keypress', function(e) {
            if (e.which === 13) {
                e.preventDefault();
                $('#searchBtn').click();
            }
        });

        // Check if we have new patient data to auto-select
        if (newPatientData) {
            autoSelectNewPatient();
        }
    });

    // Toggle between Existing Patient and New Patient Registration
    function togglePatientType() {
        var existingSection = document.getElementById('existingPatientSection');
        var newSection = document.getElementById('newPatientSection');
        var existingRadio = document.getElementById('existingPatient');
        var newRadio = document.getElementById('newPatient');

        if (existingRadio.checked) {
            existingSection.style.display = 'block';
            newSection.style.display = 'none';
            // Make existing patient fields required
            document.getElementById('mrDropdown').setAttribute('required', 'required');
            // Remove required from new patient fields
            document.getElementById('newPatientName').removeAttribute('required');
            document.getElementById('newPatientContact').removeAttribute('required');
            document.querySelectorAll('#newPatientSection input[name="gender"]').forEach(el => el.removeAttribute('required'));
        } else {
            existingSection.style.display = 'none';
            newSection.style.display = 'block';
            // Remove required from existing patient fields
            document.getElementById('mrDropdown').removeAttribute('required');
            // Make new patient fields required
            document.getElementById('newPatientName').setAttribute('required', 'required');
            document.getElementById('newPatientContact').setAttribute('required', 'required');
            document.querySelectorAll('#newPatientSection input[name="gender"]').forEach(el => el.setAttribute('required', 'required'));
        }
    }

    // Auto-select newly registered patient in existing section
    function autoSelectNewPatient() {
        if (newPatientData) {
            // Switch to existing patient section
            document.getElementById('existingPatient').checked = true;
            togglePatientType();
            
            // Set the patient in dropdown
            $('#mrDropdown').html(`<option value="${newPatientData.id}" selected>${newPatientData.mr_number} - ${newPatientData.name}</option>`);
            $('#contactnum').val(newPatientData.contact);
            
            // Show success message
            alert(`Patient registered successfully!\nMR Number: ${newPatientData.mr_number}\nName: ${newPatientData.name}`);
            
            // Clear the global variable
            newPatientData = null;
            
            // Scroll to the pre-booking form
            document.querySelector('#existingPatientSection').scrollIntoView({ behavior: 'smooth' });
        }
    }

    // Submit New Patient Form
    function submitNewPatient() {
        let patientName = $('#newPatientName').val().trim();
        let contactNumber = $('#newPatientContact').val().trim();

        // Validate required fields
        if (!patientName) {
            alert('Please enter patient name.');
            $('#newPatientName').focus();
            return;
        }
        if (!contactNumber) {
            alert('Please enter contact number.');
            $('#newPatientContact').focus();
            return;
        }

        let formData = $('#newPatientForm').serialize();

        // Check if patient already exists
        $.ajax({
            url: "{% url 'check_patient_exists' %}",
            type: "POST",
            data: {
                patientname: patientName,
                contactnumber: contactNumber,
                csrfmiddlewaretoken: '{{ csrf_token }}'
            },
            success: function(response) {
                if (response.exists) {
                    alert("Patient already registered.\nPlease use the search to find and select the patient.");
                    // Switch to existing patient section and populate search
                    document.getElementById('existingPatient').checked = true;
                    togglePatientType();
                    $('#mrSearch').val(patientName);
                    $('#searchBtn').click();
                } else {
                    // Register new patient
                    saveNewPatientAndProceed(formData);
                }
            },
            error: function() {
                alert("An error occurred while checking for duplicate patients.");
            }
        });
    }

    function saveNewPatientAndProceed(formData) {
        // Add reg_Fee=0 to ensure no invoice is generated
        formData += '&reg_Fee=0';
        
        $.ajax({
            url: "{% url 'patientdetails' %}?menumanagement_id={{ idmngmnt }}",
            type: "POST",
            data: formData,
            dataType: 'json',
            success: function(response) {
                if (response.success && response.patient_id) {
                    // Store patient data for auto-selection
                    newPatientData = {
                        id: response.patient_id,
                        name: response.patient_name || $('#newPatientName').val().trim(),
                        mr_number: response.mr_number || 'MRNO' + new Date().getTime(),
                        contact: response.patient_phone || $('#newPatientContact').val().trim()
                    };
                    
                    // Auto-switch to existing section with new patient selected
                    autoSelectNewPatient();
                } else {
                    alert(response.message || "Failed to save patient details. Please try again.");
                }
            },
            error: function(xhr, status, error) {
                alert('Failed to save patient details. Please try again.');
                console.error('Error:', error);
                console.error('Response:', xhr.responseText);
            }
        });
    }
</script>

<style>
    #newPatientSection .card {
        border: 2px dashed #007bff;
        background: #f8f9fa;
    }
    #newPatientSection .card .card-body {
        background: #ffffff;
    }
    .text-danger {
        color: #dc3545 !important;
    }
    .form-check-inline {
        margin-right: 20px;
    }
</style>

{% endblock %}
