{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="content-wrapper">
    <section class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6"><h1>Pre-Appointment Booking</h1></div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-right">
                        <li class="breadcrumb-item"><a href="{% url 'pre_appointment_booking_list' %}?menumanagement_id={{ idmngmnt }}">Pre-Booking List</a></li>
                        <li class="breadcrumb-item active">Book</li>
                    </ol>
                </div>
            </div>
        </div>
    </section>
    <section class="content">
        <div class="row">
            <div class="col-md-12">
                <div class="card card-primary">
                    <div class="card-header"><h3 class="card-title">Pre-Appointment Details (No Payment Required)</h3></div>
                    <form method="POST" action="{% url 'pre_appointment_booking' %}?menumanagement_id={{idmngmnt}}">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-8">
                                            <div class="form-group">
                                                <label>MR Number/PhoneNo/Name</label>
                                                <input type="text" id="mrSearch" class="form-control" placeholder="Type to search">
                                            </div>
                                        </div>
                                        <div class="col-md-4 mt-4">
                                            <a id="searchBtn" class="btn btn-primary text-white">Search</a>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label>Selected Patient</label>
                                        <select class="form-control" name="mrnum" id="mrDropdown" required>
                                            <option selected disabled value="">Select</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Appointment Date</label>
                                        <input type="date" class="form-control" name="apntdate" required>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="card-body">
                                    <div class="form-group">
                                        <label>Department</label>
                                        <select class="form-control" name="deptname" id="inputdept" required>
                                            <option selected disabled value="">Select</option>
                                            {% for i in departmentobj %}<option value="{{i.id}}">{{i.Department_Name}}</option>{% endfor %}
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Designation Name</label>
                                        <select class="form-control" name="desgname" id="inputdesgn" required>
                                            <option selected disabled value="">Select</option>
                                            {% for i in designobj %}<option value="{{i.id}}">{{i.Designation_Name}}</option>{% endfor %}
                                        </select>
                                        <input type="hidden" value="{{request.session.branchid}}" name="branch" id="brch">
                                    </div>
                                    <div class="form-group">
                                        <label>Doctor Name</label>
                                        <select class="form-control" name="docname" id="docname" required>
                                            <option selected disabled value="">Select</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Status</label>
                                        <select class="form-control" name="status" required>
                                            <option value="" selected disabled>Select</option>
                                            {% for i in appointment_status %}<option value="{{i.status_name}}">{{i.status_name}}</option>{% endfor %}
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Contact No</label>
                                        <input type="text" class="form-control" name="contactnum">
                                    </div>
                                
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <button type="submit" class="btn btn-success">Save Pre-Booking</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</div>

<!-- Search Modal -->
<div class="modal fade" id="searchModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Search Results</h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <table id="searchResultsTable" class="display table table-bordered">
                    <thead><tr><th>MR Number</th><th>Patient Name</th><th>Contact No</th><th>Action</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function () {
    let table = $('#searchResultsTable').DataTable({paging: true, searching: true, info: true, pageLength: 10});

    $('#searchBtn').on('click', function() {
        let query = $('#mrSearch').val();
        if (query.trim() === '') { alert('Please enter a search term.'); return; }
        table.clear().draw();
        fetch(`{% url 'search_mrno' %}?query=${query}`)
        .then(response => response.json())
        .then(data => {
            if (data.length > 0) {
                data.forEach(item => {
                    let actionBtn = `<a class="btn btn-primary select-btn text-white" data-id="${item.id}" data-name="${item.Patient_Name}" data-mrno="${item.Medical_Record_Number}" data-contact="${item.contactno}">Select</a>`;
                    table.row.add([item.Medical_Record_Number, item.Patient_Name, item.contactno, actionBtn]).draw(false);
                });
                $('#searchModal').modal('show');
            } else { alert('No matching records found.'); }
        });
    });

    $('#searchResultsTable tbody').on('click', '.select-btn', function() {
        let id = $(this).data('id'), mrno = $(this).data('mrno'), name = $(this).data('name'), contact = $(this).data('contact');
        $('#mrDropdown').html(`<option value="${id}" selected>${mrno} - ${name}</option>`);
        $('input[name="contactnum"]').val(contact);
        $('#searchModal').modal('hide');
    });

    $('#brch,#deptname, #inputdesgn').on('change', function() {
        var brch = $('#brch').val(), desg = $('#inputdesgn').val(), dept = $('#inputdept').val();
        var dropdown = $('#docname');
        dropdown.empty().append('<option selected disabled>Loading...</option>');
        if (brch && desg && dept) {
            $.ajax({
                type: 'GET', url: "{% url 'get_staff_by_branch_and_designation' %}",
                data: { branch: brch, designation: desg, department: dept},
                success: function(data) {
                    dropdown.empty().append('<option selected disabled>Select</option>');
                    if (data.length > 0) {
                        data.forEach(function(item) {
                            dropdown.append(`<option value="${item.Staff_id}">${item.Staff_firstname} ${item.Staff_lastname} - ${item.deprt}</option>`);
                        });
                    } else { dropdown.append('<option selected disabled>No staff found</option>'); }
                }
            });
        }
    });
});
</script>
{% endblock %}
