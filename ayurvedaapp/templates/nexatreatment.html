<div class="modal fade" id="searchModal" tabindex="-1" role="dialog" aria-labelledby="searchModalLabel" aria-hidden="true">

        </div>

                <th>Contact No</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <!-- Results will be appended here -->
            </tbody>
          </table>
        </div>
        <div class="modal-footer">

        </div>
      </div>
    </div>

    $(document).ready(function() {
        // Initialize DataTable (without data initially)
        let table = $('#searchResultsTable').DataTable({
            paging: true,
            searching: true,
            info: true,
            lengthChange: true,
            pageLength: 10,
        });

        // Event listener for the search button click
        $('#searchBtn').on('click', function() {
            let query = $('#mrSearch').val();
            // Ensure the search query is not empty
            if (query.trim() === '') {
                alert('Please enter a search term.');
                return;
            }
            // Clear previous table data  
            table.clear().draw();
            // Send an AJAX request to search for the query
            fetch(`/search_mrno?query=${query}`)
                .then(response => response.json())
                .then(data => {
                    // Check if data exists
                    if (data.length > 0) {
                        // Loop through the results and add to the table  
                        data.forEach(item => {
                            let actionBtn = `<button class="btn btn-primary select-btn" data-id="${item.id}" 
                                              data-name="${item.Patient_Name}" 
                                              data-mrno="${item.Medical_Record_Number}" 
                                              data-contact="${item.contactno}"
                                              data-address="${item.Housename}">
                                            Select
                                        </button>`;
                            table.row.add([
                                item.Medical_Record_Number,
                                item.Patient_Name,
                                item.Housename || 'N/A',
                                item.contactno,
                                actionBtn,
                            ]).draw(false);
                        });
                        $('#searchModal').modal('show');
                    } else {
                        alert('No matching records found.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('There was an error retrieving the data. Please try again.');
                });

<script>
$(document).ready(function() {
    // Event delegation for dynamic search treatment inputs
    $(document).on('keyup', '.searchInput', function() {
        const query = $(this).val();
        const currentRowId = $(this).closest('.treatment-row').data('row-id'); // Get row id
        const searchResultsId = `#searchResults${currentRowId}`; // Dynamically target the corresponding searchResults
        const tratmntidInput = `#tratmntid${currentRowId}`; // Dynamically target the hidden treatment ID input

        // Only trigger the search if query length is sufficient (at least 3 characters)
        if (query.length >= 1) {
            $.ajax({
                url: "{% url 'search_treatment' %}",
                data: { 'term': query },
                dataType: 'json',
                success: function(data) {
                    $(searchResultsId).empty(); // Clear previous results

                    if (data.length > 0) {
                        // Populate search results with treatment options
                        $.each(data, function(index, item) {
                            const option = $('<option></option>')
                                .attr('value', item.trid) // Treatment ID
                                .text(item.tr_name); // Treatment Name
                            $(searchResultsId).append(option);
                        });

                        // Trigger the change event to auto-select the first result
                        $(searchResultsId).trigger('change');
                    } else {
                        // If no results are found
                        $(searchResultsId).append('<option>No results found</option>');
                    }
                },
                error: function() {
                    // Handle AJAX error
                    $(searchResultsId).append('<option>Error fetching results</option>');
                }
            });
        } else {
            // Clear the search results if the query is too short
            $(searchResultsId).empty().append('<option>Select</option>');
        }
    });

    // Event listener for when the user selects a treatment from the dropdown
    $(document).on('change', '.particulars', function() {
        const selectedOption = $(this).find(':selected'); // Get the selected option
        const treatmentRow = $(this).closest('.treatment-row'); // Get the closest treatment row

        // Get the treatment ID from the selected option
        const treatmentId = selectedOption.val(); // Treatment ID

        // Ensure there is a hidden input for the treatment ID and update it
        const treatmentIdInput = treatmentRow.find('input[name^="treatments["][name$="[tratmntid]"]');
        treatmentIdInput.val(treatmentId); // Set treatment ID in the hidden input

        // Update the treatment details if a treatment is selected
        const treatmentName = selectedOption.text(); // Treatment Name
        const treatmentDetailsInput = treatmentRow.find('input[name^="treatments["][name$="[treatment_details]"]');
        treatmentDetailsInput.val(treatmentName); // Update treatment details input

        console.log("Selected Treatment ID:", treatmentId); // Debugging line
        console.log("Selected Treatment Name:", treatmentName); // Debugging line
    });
});

</script>
