{% extends 'base.html' %}
{% load static %}
{% block content %}


  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1>Physical Stock Details </h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item">
                <a href="{% url 'physicaltable'%}">View All</a></li>
              <li class="breadcrumb-item active">Physical Stock</li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">

      <div class="row">
        <div class="col-md-12">
          <div class="card card-primary">
            <div class="card-header">
              <h3 class="card-title">Physical Stock</h3>

              <div class="card-tools">
                <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                  <!-- <i class="fas fa-minus"></i> -->
                </button>
              </div>
            </div>
            <form method="POST", action="{% url 'physicalstk' %}">
             
                {% csrf_token %}
      <div class="row">
          <div class="col-md-6">
              <div class="card">
             
             
                <div class="card-body">
                    <div class="form-group">
                    <label for="exampleInputFirstName">Store</label>
                   <select class="form-control" name="strname" required>
                        <option selected disabled value="">Select</option>
                                        {% for i in stornm %}
                            

                      <option value="{{i.id}}">{{i.storename}}</option>
                     
                                        {% endfor %}
                      </select>
                  </div>
                 
                  <div class="form-group">
                    <label for="exampleInputFirstName">Item</label>
                   <select class="form-control" name="itm" required>
                        <option selected disabled value="">Select</option>
                                        {% for i in itmdt %}
                    
                      <option value="{{i.id}}">{{i.Medicinename}}</option>
                     
                                        {% endfor %}
                      </select>
                  </div>
                  
                
                  
                  
                </div>
              </div>
            </div>
                <!-- /.card-body -->
             
              <div class="col-md-6">
              <div class="card">
             
             
                <div class="card-body">
                   
                    <div class="form-group">
                        <label for="exampleInputContactNo">Quantity</label>
                        <input type="text" class="form-control" id="exampleInputUsername" name="qty" placeholder="Enter Quantity" required>
                      </div>
                      <div class="form-group">
                        <label for="exampleInputContactNo">Unit</label>
                        <select class="form-control" name="unt" required>
                        <option selected disabled value="">Select</option>
                        {% for i in un %}
            

      <option value="{{i.id}}">{{i.unitname}}</option>
     
                        {% endfor %}
      </select> </div>
                  
                </div>
              </div>
            </div>
          </div>
                <div class="card-footer">
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>
              </form>
            <!-- /.card-body -->
          </div>
          <!-- /.card -->
        </div>
     
      </div>

      
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->
{% endblock %}
