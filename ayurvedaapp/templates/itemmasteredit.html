{% extends 'base.html' %}
{% load static %}
{% block content %}

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1>Medicine Details</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="{% url 'itemtable' %}">View All</a></li>
              <li class="breadcrumb-item active">Medicine</li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">

      <div class="row">
        <div class="col-md-12">
          <div class="card card-primary">
            <div class="card-header">
              <h3 class="card-title">Medicine</h3>

              <div class="card-tools">
                <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                  <!-- <i class="fas fa-minus"></i> -->
                </button>
              </div>
            </div>
              <form method="POST", action="{% url 'edititemmaster' %}">
             
                {% csrf_token %}
      <div class="row">
          <div class="col-md-6">
              <div class="card">
             
             
                <div class="card-body">
                    <div class="form-group">
                    <label for="exampleInputFirstName">Purchase Invoice No</label><input type="hidden" 
                    name="itmstrid" value="{{objeditmmstr.id}}">
                    <input type="text" class="form-control" id="exampleInputInvoiceNo" name="purchaseinvoicenum" placeholder="Enter Purchase Invoice No" value="{{objeditmmstr.Purchase_Invoice_no}}">
                  </div>
                   <div class="form-group">
                    <label for="exampleInputEmail1">Medicine Name</label>
                    <input type="text" class="form-control" id="exampleInputLastName" name="medicinename" placeholder="Enter  Medicine Name" value="{{objeditmmstr.Medicinename}}">
                  </div>
                  <div class="form-group">
                    <label for="exampleInputHouse">Generic Name</label>
                    <input type="text" class="form-control" id="exampleInputgenericname" name="genericname" placeholder="Enter Generic Name" value="{{objeditmmstr.Generic_name}}">
                  
                  </div>
                  
                  <div class="form-group">
                    <label for="exampleInputPincode">Company</label>
                <select class="form-control" name="company">
                    <option selected>Select</option>
                                        {% for i in companyobj %}

                      <option value="{{i.id}}" {% if i.id == objeditmmstr.Comapany_name_id %}selected{% endif %}>{{i.Comapany_name}}</option>
                                        {% endfor %}
                      </select>
                  </div>
                  <div class="form-group">
                    <label for="exampleInputPincode">Batch No</label>
                <select class="form-control" name="batchnumber">
                    <option selected>Select</option>
                                        {% for i in batchobj %}

                      <option value="{{i.id}}" {% if i.id == objeditmmstr.Batch_no_id %}selected{% endif %}>{{i.Batch_no}}</option>
                                        {% endfor %}
                        
                      </select>
                  </div>
                   <div class="form-group">
                    <label for="exampleInputRegisterNo">Sub Category</label>
                    <select class="form-control" name="subcategory">
                     <option selected>Select</option>
                                        {% for i in subcategoryobj %}

                      <option value="{{i.id}}" {% if i.id == objeditmmstr.Subcategory_name_id %}selected{% endif %}>{{i.Subcategory_name}}</option>
                                        {% endfor %}
                      </select>
                  </div>
                   
               
                </div>
              </div>
            </div>
                <!-- /.card-body -->
             
              <div class="col-md-6">
              <div class="card">
             
             
                <div class="card-body">
                  
                   <div class="form-group">
                    <label for="exampleInputRegisterNo">Manufacture Date</label>
                    <input type="date"  class="form-control" id="exampleInputManufactureDate" name="mfgdate"  value="{{ objeditmmstr.Manufacturer_date|date:'Y-m-d' }}">
                  
                  </div>
                      <div class="form-group">
                    <label for="exampleInputRegisterNo">Expiry Date</label>
                    <input type="date" class="form-control" id="exampleInputExpiryDate" name="expdate" placeholder="Enter Generic Name" value="{{objeditmmstr.Expiry_date|date:'Y-m-d' }}">

                  </div>
                  
                
                  <div class="form-group">
                    <label for="exampleInputRegisterNo">Side Effects</label>
                    <textarea  class="form-control" name="sideeffects">
                      {{objeditmmstr.Sideeffect}}
                    </textarea>
                  </div>
                  <div class="form-group">
                    <label for="exampleInputRegisterNo">Quantity</label>
                     <input type="text" class="form-control" id="exampleInputQuantity" name="quantity" placeholder="Enter Quantity" 
                     value="{{objeditmmstr.Quantity}}">
                  </div>
                   <div class="form-group">
                    <label for="exampleInputRate">Rate</label>
                     <input type="text" class="form-control" id="exampleInputrate" name="rate" placeholder="Enter Rate" value="{{objeditmmstr.Rate}}">
                  </div>
                  <div class="form-group">
                    <label for="exampleInputHouse">Supplier Name</label>
                    <input type="text" class="form-control" id="exampleInputgenericname" name="suppliername" placeholder="Enter Supplier Name" value="{{objeditmmstr.Suppliername}}">
                  
                  </div>
                </div>
              </div>
            </div>
          </div>
                <div class="card-footer">
                   {% if messages %}
        {% for message in messages %}
        <p style="color:green;">{{message}}</p> 
        {% endfor %}
        {% endif %}
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>
              </form>
            <!-- /.card-body -->
          </div>
          <!-- /.card -->
        </div>
     
      </div>

      
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->
{% endblock %}
