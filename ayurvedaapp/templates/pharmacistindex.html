<script>
  function converterDataParaDjangoFormat(data) {
      const dataJS = new Date(data);
      const ano = dataJS.getFullYear();
      const mes = (dataJS.getMonth() + 1).toString().padStart(2,'0');
      const dia = dataJS.getDate().toString().padStart(2, '0');
      const hora = dataJS.getHours().toString().padStart(2, '0');
      const minuto = dataJS.getMinutes().toString().padStart(2, '0');
      const segundo = dataJS.getSeconds().toString().padStart(2, '0');
      const formatoDjango = `${ano}-${mes}-${dia} ${hora}:${minuto}:${segundo}`;
      return formatoDjango;
      var selectedroom = $("#selectedroom option:selected").val();
  }
  document.addEventListener('DOMContentLoaded', function() {
  var calendarEl = document.getElementById('calendar');
  var calendar = new FullCalendar.Calendar(calendarEl, {
    // Your calendar configuration
     eventClick: function(info) {

            // Extract start date of the event
           var startDate = info.event.start;
            // Increment the start date by one day
            var nextDay = new Date(startDate);
            nextDay.setDate(nextDay.getDate() + 1);
            // Format the start date as required (e.g., YYYY-MM-DD)
            var formattedStartDate = nextDay.toISOString().split('T')[0];
            // Redirect to the booking table page with the start date as a URL parameter
            window.location.href = '/booking_table/' + formattedStartDate;
        }

  });
  calendar.render();
  $('#selectedroom').on('change', function() {
    var selectedRoomId = $(this).val();
    
    // Clear existing events from the calendar
    calendar.removeAllEvents();
    
    // Make an AJAX request to fetch booking ranges for the selected room
    $.ajax({
        url: '/get_booking_dates/',
        method: 'GET',
        data: { room_id: selectedRoomId },
        success: function(response) {
            if (calendar && calendar.addEvent) {
                var bookingRanges = response.booking_ranges;
                var ptdt=response.patientname;

                bookingRanges.forEach(function(bookingRange) {
                    var bookingStartDate = new Date(bookingRange.start_date);
                    var bookingEndDate = new Date(bookingRange.end_date);
                    
                    // Increment end date by one day to include it in the range
                    bookingEndDate.setDate(bookingEndDate.getDate() + 1);

                        var title = 'Booked by ' + bookingRange.patient_name + ', Ph: ' + bookingRange.patient_phno;

                    var event = {
                         title: title,
                        start: bookingStartDate.toISOString().split('T')[0], // Convert to ISO string and extract date part
                        end: bookingEndDate.toISOString().split('T')[0], // Convert to ISO string and extract date part
                        rendering: 'background', // Specify that it's a background event
                        backgroundColor: 'green'
                    };
                    // Add event to the calendar
                    calendar.addEvent(event);
                });
            } else {
                console.error('Calendar instance or addEvent method is not available.');
            }
        },
        error: function(xhr, status, error) {
            console.error('Error fetching booking ranges:', error);
        }
    });
});




});
